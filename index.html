<!DOCTYPE html>
<html lang="pt-BR" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Central de Cálculos de Leilões e Imóveis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>

  <style>
    /* Tokens no padrão shadcn/ui (canais RGB, para aceitar opacidade). Paleta da marca: azul-marinho + verde-esmeralda. */
    :root {
      --background: 244 247 251;
      --foreground: 30 41 59;
      --card: 255 255 255;
      --card-foreground: 30 41 59;
      --primary: 20 36 58;
      --primary-foreground: 255 255 255;
      --secondary: 237 242 247;
      --secondary-foreground: 30 41 59;
      --muted: 237 242 247;
      --muted-foreground: 100 116 139;
      --accent: 237 242 247;
      --accent-foreground: 30 41 59;
      --destructive: 220 38 38;
      --border: 226 232 240;
      --input: 203 213 225;
      --ring: 15 139 104;
      --success: 15 139 104;
      --warning: 180 83 9;
      --radius: 0.625rem;
    }
    html.dark {
      --background: 11 20 36;
      --foreground: 241 245 249;
      --card: 20 36 58;
      --card-foreground: 241 245 249;
      --primary: 5 150 105;
      --primary-foreground: 255 255 255;
      --secondary: 30 52 80;
      --secondary-foreground: 241 245 249;
      --muted: 30 52 80;
      --muted-foreground: 148 163 184;
      --accent: 38 62 92;
      --accent-foreground: 241 245 249;
      --destructive: 248 113 113;
      --border: 41 73 107;
      --input: 51 85 122;
      --ring: 52 211 153;
      --success: 52 211 153;
      --warning: 251 191 36;
    }
    html, body {
      font-family: Inter, system-ui, sans-serif;
      background: rgb(var(--background));
    }
    /* Layout de impressão dedicado: documento formal (tabelas, cabeçalho, assinatura),
       não uma cópia com CSS forçado do dashboard da tela. */
    @page {
      size: A4;
      margin: 16mm 14mm;
    }
    @media print {
      html, body {
        background: #ffffff !important;
      }
      .print-hide { display: none !important; }
      .print-page-wrapper { margin: 0 !important; padding: 0 !important; }
      .avoid-break { page-break-inside: avoid; break-inside: avoid; }
      table { page-break-inside: auto; }
      tr { page-break-inside: avoid; break-inside: avoid; }
      thead { display: table-header-group; }
    }

    /* Microinterações discretas: transições curtas, foco visível e campo ativo destacado */
    button, a, input, select, textarea {
      transition: background-color .15s ease, border-color .15s ease, color .15s ease, box-shadow .15s ease, transform .15s ease, opacity .15s ease;
    }
    button:active:not(:disabled) { transform: scale(.98); }
    :focus { outline: none; }
    :focus-visible { outline: 2px solid rgb(var(--ring)); outline-offset: 2px; border-radius: 6px; }
    /* Foco no padrão shadcn: borda + anel de 3px a 50% */
    input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: none;
      border-color: rgb(var(--ring));
      box-shadow: 0 0 0 3px rgb(var(--ring) / .5);
    }

    @keyframes section-in {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: none; }
    }
    @keyframes value-in {
      from { opacity: .35; }
      to { opacity: 1; }
    }
    .section-open { animation: section-in .22s ease-out; }
    .value-update { animation: value-in .3s ease-out; }

    /* Respeita a preferência de movimento reduzido do sistema */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
          },
          colors: {
            // Tokens shadcn/ui (valores em :root e html.dark)
            background: 'rgb(var(--background) / <alpha-value>)', foreground: 'rgb(var(--foreground) / <alpha-value>)',
            card: { DEFAULT: 'rgb(var(--card) / <alpha-value>)', foreground: 'rgb(var(--card-foreground) / <alpha-value>)' },
            primary: { DEFAULT: 'rgb(var(--primary) / <alpha-value>)', foreground: 'rgb(var(--primary-foreground) / <alpha-value>)' },
            secondary: { DEFAULT: 'rgb(var(--secondary) / <alpha-value>)', foreground: 'rgb(var(--secondary-foreground) / <alpha-value>)' },
            muted: { DEFAULT: 'rgb(var(--muted) / <alpha-value>)', foreground: 'rgb(var(--muted-foreground) / <alpha-value>)' },
            accent: { DEFAULT: 'rgb(var(--accent) / <alpha-value>)', foreground: 'rgb(var(--accent-foreground) / <alpha-value>)' },
            destructive: 'rgb(var(--destructive) / <alpha-value>)',
            border: 'rgb(var(--border) / <alpha-value>)', input: 'rgb(var(--input) / <alpha-value>)', ring: 'rgb(var(--ring) / <alpha-value>)',
            success: 'rgb(var(--success) / <alpha-value>)', warning: 'rgb(var(--warning) / <alpha-value>)',
            // Paleta da marca: azul-marinho, azul secundário e verde-esmeralda
            navy: { 100: '#E8EDF4', 500: '#29496B', 700: '#29496B', 900: '#14243A' },
            emerald: { 50: '#ECFDF5', 100: '#D1FAE5', 300: '#6EE7B7', 400: '#34D399', 500: '#10B981', 600: '#0F8B68', 700: '#0B6F55', 800: '#0A5A46', 900: '#084536' },
            // Tons neutros: fundo #F4F7FB, bordas #E2E8F0, texto #1E293B / #64748B
            slate: { 50: '#F4F7FB', 100: '#EDF2F7', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155', 800: '#1E293B', 900: '#14243A', 950: '#0B1424' },
            gray: { 50: '#F4F7FB', 100: '#EDF2F7', 200: '#E2E8F0', 300: '#CBD5E1', 400: '#94A3B8', 500: '#64748B', 600: '#475569', 700: '#334155', 800: '#1E293B', 900: '#14243A' },
            red: { 50: '#FEF2F2', 100: '#FEE2E2', 500: '#EF4444', 600: '#DC2626', 700: '#B91C1C' },
            amber: { 50: '#FFFBEB', 100: '#FEF3C7', 400: '#FBBF24', 500: '#F59E0B', 600: '#D97706', 700: '#B45309' },
          },
          borderRadius: { lg: 'var(--radius)', md: 'calc(var(--radius) - 2px)', sm: 'calc(var(--radius) - 4px)', xl: 'calc(var(--radius) + 4px)' },
          borderColor: { DEFAULT: 'rgb(var(--border) / <alpha-value>)' },
          boxShadow: {
            xs: '0 1px 2px 0 rgb(0 0 0 / 0.05)',
            card: '0 1px 2px rgba(20, 36, 58, 0.04), 0 4px 16px rgba(20, 36, 58, 0.06)',
          },
        },
      },
    }
  </script>
  <!-- Módulos da plataforma (camadas separadas: utilitários, motor de cálculo local, interface) -->
  <script src="js/regras.js"></script>
  <script src="js/calculo.js"></script>
  <script src="js/historico.js"></script>
  <script src="js/demonstrativo.js"></script>
  <script src="js/xlsx.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/registro.js"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors duration-200">
  <div id="root"></div>

  <script type="text/babel" src="js/componentes.js"></script>
  <script type="text/babel" src="js/blocos.js"></script>
  <script type="text/babel" src="js/debitos.js"></script>
  <script type="text/babel" src="js/parcelas.js"></script>
  <script type="text/babel" src="js/planilha.js"></script>
  <script type="text/babel" src="js/pensao.js"></script>
  <script type="text/babel" src="js/memorias.js"></script>
  <script type="text/babel" src="js/painel.js"></script>
  <script type="text/babel" src="js/plataforma.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- Ícones SVG ---
    const Building = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2Z"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2Z"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></svg>;
    const FileText = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>;
    const Printer = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>;
    const Settings = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>;
    const Moon = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>;
    const Sun = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>;
    const Tree = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 2L3 9h3v10h12V9h3L12 2z"/><path d="M12 22V19"/></svg>;
    const Car = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a2 2 0 0 0-1.6-.8H9.3a2 2 0 0 0-1.6.8L5 11l-5.16.86a1 1 0 0 0-.84.99V16h3m10 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0m-7 0a2 2 0 1 1-4 0m4 0a2 2 0 1 0-4 0"/></svg>;
    const Home = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const ChevronDown = ({ className }) => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"/></svg>;

    // --- Helpers Core ---
    const formatCurrencyStr = (value) => {
        if (value === '' || value === 0 || value == null) return '';
        return Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    };

    const formatMoney = (val) => {
      if (val === '' || val == null || isNaN(val)) return 'R$ 0,00';
      return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val);
    };

    const formatPercent = (value) => `${Number(value).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}%`;

    // ROI a partir do qual a arrematação é tratada como confortável (abaixo disso: margem apertada)
    const ROI_CONFORTAVEL = 15;

    // Indicador secundário do painel de resultado: o texto da legenda comunica o resultado, não só a cor
    const Estatistica = ({ label, value, sub, tone = 'neutral' }) => {
      const cor = {
        good: 'text-emerald-700 dark:text-emerald-400',
        bad: 'text-red-600 dark:text-red-400',
        neutral: 'text-foreground',
      }[tone];
      return (
        <div className="min-w-0">
          <div className="text-[11px] font-semibold uppercase tracking-wide text-muted-foreground">{label}</div>
          <div key={value} className={`value-update mt-1 text-base sm:text-lg font-bold tabular-nums truncate ${cor}`}>{value}</div>
          {sub && <div className="mt-0.5 text-[11px] text-muted-foreground">{sub}</div>}
        </div>
      );
    };

    // Controle segmentado (escolha única entre poucas opções)
    const Segmentado = ({ opcoes, valor, onChange, rotulo, className = '' }) => (
      <div role="radiogroup" aria-label={rotulo} className={`inline-flex items-center justify-center h-9 w-fit p-[3px] rounded-lg bg-muted text-muted-foreground ${className}`}>
        {opcoes.map((o) => (
          <button key={o.valor} type="button" role="radio" aria-checked={valor === o.valor} onClick={() => onChange(o.valor)}
            className={`inline-flex h-[calc(100%-1px)] flex-1 items-center justify-center gap-1.5 px-3 text-sm font-medium whitespace-nowrap rounded-md border border-transparent transition-all outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 ${valor === o.valor ? 'bg-background text-foreground shadow-sm dark:bg-input/40 dark:border-input' : 'text-foreground/60 hover:text-foreground'}`}>
            {o.icone && <o.icone className="w-4 h-4" />}{o.rotulo}
          </button>
        ))}
      </div>
    );

    // Bloco recolhível para campos opcionais (abre sozinho quando já há algo preenchido)
    const Revelar = ({ titulo, aberto, onAlternar, children }) => (
      <div className="border-t border-slate-100 dark:border-slate-700/60 pt-3">
        <button type="button" onClick={onAlternar} aria-expanded={aberto}
          className="inline-flex items-center gap-1.5 text-sm font-semibold text-emerald-700 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-300">
          <ChevronDown className={`w-4 h-4 transition-transform ${aberto ? 'rotate-180' : ''}`} /> {titulo}
        </button>
        {aberto && <div className="mt-4 space-y-4 section-open">{children}</div>}
      </div>
    );

    // Menu "Exportar": reúne as saídas secundárias para deixar um único botão principal
    const MenuExportar = ({ itens }) => {
      const [aberto, setAberto] = useState(false);
      const ref = React.useRef(null);
      useEffect(() => {
        if (!aberto) return undefined;
        const fora = (e) => { if (ref.current && !ref.current.contains(e.target)) setAberto(false); };
        const tecla = (e) => { if (e.key === 'Escape') setAberto(false); };
        document.addEventListener('mousedown', fora);
        window.addEventListener('keydown', tecla);
        return () => { document.removeEventListener('mousedown', fora); window.removeEventListener('keydown', tecla); };
      }, [aberto]);
      return (
        <div ref={ref} className="relative flex-1">
          <button type="button" onClick={() => setAberto(!aberto)} aria-expanded={aberto} aria-haspopup="menu"
            className="w-full inline-flex items-center justify-center gap-2 h-10 px-4 rounded-md border border-input bg-card text-sm font-medium text-foreground shadow-xs hover:bg-accent hover:text-accent-foreground outline-none transition-all focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50">
            Exportar <ChevronDown className={`w-4 h-4 transition-transform ${aberto ? 'rotate-180' : ''}`} />
          </button>
          {aberto && (
            <div role="menu" className="absolute bottom-full left-0 right-0 mb-2 z-20 py-1 rounded-lg border border-border bg-card shadow-md section-open">
              {itens.map((item) => (
                <button key={item.rotulo} type="button" role="menuitem" onClick={() => { setAberto(false); item.acao(); }}
                  className="w-full text-left px-4 py-2.5 text-sm text-foreground hover:bg-slate-50 dark:hover:bg-white/5">
                  <span className="font-semibold">{item.rotulo}</span>
                  {item.detalhe && <span className="block text-xs text-muted-foreground">{item.detalhe}</span>}
                </button>
              ))}
            </div>
          )}
        </div>
      );
    };

    // Ações do painel de resultado: uma ação principal, as demais no menu "Exportar"
    const AcoesResultado = ({ rotuloPrincipal, onPrincipal, onExcel, onPdfPlanilha, onCopiar, onWhatsapp, onLimpar }) => (
      <div className="mt-6 space-y-2 print-hide">
        <button type="button" onClick={onPrincipal} className="w-full inline-flex items-center justify-center gap-2 h-10 rounded-md bg-primary text-primary-foreground text-sm font-medium shadow-xs hover:bg-primary/90 outline-none transition-all focus-visible:ring-[3px] focus-visible:ring-ring/50">
          <Printer className="w-5 h-5 flex-shrink-0" /> {rotuloPrincipal}
        </button>
        <div className="flex gap-2">
          <MenuExportar itens={[
            { rotulo: 'Planilha de cálculo (Excel)', detalhe: 'Arquivo .xlsx com fórmulas', acao: onExcel },
            { rotulo: 'Planilha de cálculo (PDF)', detalhe: 'Tabela pronta para enviar', acao: onPdfPlanilha },
            { rotulo: 'Copiar resumo', detalhe: 'Texto curto para colar', acao: onCopiar },
            { rotulo: 'Enviar pelo WhatsApp', acao: onWhatsapp },
          ]} />
          <button type="button" onClick={onLimpar} className="h-10 px-4 rounded-md text-sm font-medium text-muted-foreground hover:bg-accent hover:text-accent-foreground outline-none transition-all focus-visible:ring-[3px] focus-visible:ring-ring/50">Limpar</button>
        </div>
      </div>
    );

    const formatDateTime = (date) => date.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    const safeNumber = (val) => {
        if (val === '' || val == null) return 0;
        if (typeof val === 'number') return val;
        const strVal = String(val).replace(',', '.');
        const num = parseFloat(strVal);
        return isNaN(num) ? 0 : num;
    };

    // --- Componentes de entrada (mesmo visual dos demais módulos: js/componentes.js) ---
    const ENTRADA = 'block w-full h-10 min-w-0 px-3 py-1 text-base md:text-sm rounded-md border border-input bg-transparent dark:bg-input/30 text-foreground shadow-xs transition-[color,box-shadow] outline-none placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50 disabled:cursor-not-allowed disabled:opacity-60 disabled:bg-muted/50';
    const ROTULO = 'block text-sm font-medium leading-none text-foreground mb-2';
    const AJUDA = 'mt-1 text-xs text-muted-foreground';
    const BORDA_MOEDA = '';

    let contadorCampos = 0;
    const useIdCampo = () => {
      const ref = React.useRef(null);
      if (ref.current === null) { contadorCampos += 1; ref.current = `campo-leilao-${contadorCampos}`; }
      return ref.current;
    };

    const TextInput = ({ label, value, onChange, placeholder }) => {
      const id = useIdCampo();
      return (
        <div>
          <label htmlFor={id} className={ROTULO}>{label}</label>
          <input id={id} type="text" value={value} onChange={(e) => onChange(e.target.value)} placeholder={placeholder} className={ENTRADA} />
        </div>
      );
    };

    const limparDecimal = (texto) => {
      let val = texto.replace(/[^0-9,]/g, '');
      const parts = val.split(',');
      if (parts.length > 2) val = parts[0] + ',' + parts.slice(1).join('');
      return val;
    };

    const DecimalInput = ({ label, value, onChange, placeholder, subText }) => {
      const id = useIdCampo();
      return (
        <div>
          <label htmlFor={id} className={ROTULO}>{label}</label>
          <input id={id} type="text" inputMode="decimal" value={value} onChange={(e) => onChange(limparDecimal(e.target.value))} placeholder={placeholder} className={`${ENTRADA} tabular-nums`} />
          {subText && <p className={AJUDA}>{subText}</p>}
        </div>
      );
    };

    const PercentInput = ({ label, value, onChange, placeholder, extraElement, max }) => {
      const id = useIdCampo();
      const handleChange = (e) => {
        let val = limparDecimal(e.target.value);

    // Os valores em R$ desta calculadora são guardados como número; o campo trabalha com o texto
    // mascarado ("350.000,00") e devolve o número a cada tecla. Quando o valor muda por fora
    // (lance sugerido, limpar, abrir caso, total/por m²) o texto acompanha.
    const centavos = (v) => {
      if (v === '' || v == null) return null;
      const n = window.CentralRegras.lerValor(v);
      return Number.isNaN(n) ? null : Math.round(n * 100);

      const [texto, setTexto] = useState(() => R.textoCampoMoeda(value));
      useEffect(() => {
        if (centavos(texto) !== centavos(value)) setTexto(R.textoCampoMoeda(value));
      }, [value]);
      const alterar = (t) => {
        setTexto(t);
        const n = R.lerValor(t);
        onChange(t === '' || Number.isNaN(n) ? '' : n);
      };
      return [texto, alterar];

    const buscarFaixa = (tabela, valor, campo) => {

      return faixa ? faixa[campo] : tabela[tabela.length - 1][campo];

    const calcularEscrituraPR = (valor) => {
      if (!valor) return { total: 0, extrapolado: false };
      const base = buscarFaixa(TABELA_ESCRITURA_PR_2026, valor, 'base');
      const fadep = base * 0.05;
      const selo = 8.00;
      const iss = base * 0.03;
      return { total: base + fadep + selo + iss, extrapolado: valor > TETO_TABELA_ESCRITURA_PR };

      const buildCurrentState = () => ({

        setNegocioValor(s.negocioValor ?? ''); setValorVenalEsc(s.valorVenalEsc ?? '');
        setIncluirRgi(s.incluirRgi ?? true);
        setEscrituraMode(s.escrituraMode || 'pr');
        setItbiEscritura(s.itbiEscritura || { value: '2', type: 'percent' });
        setEscrituraManual(s.escrituraManual || { value: '', type: 'fixed' });
        setRgiManual(s.rgiManual || { value: '', type: 'fixed' });
        setCertidoesEsc(s.certidoesEsc ?? ''); setDiligenciasEsc(s.diligenciasEsc ?? '');
        setShowItbiEsc(s.showItbiEsc ?? true); setShowLavraturaEsc(s.showLavraturaEsc ?? true); setShowFunrejusEsc(s.showFunrejusEsc ?? true);
        setShowCertidoesEsc(s.showCertidoesEsc ?? true); setShowDiligenciasEsc(s.showDiligenciasEsc ?? true);
        setOutrosDescEsc(s.outrosDescEsc || ''); setOutrosValorEsc(s.outrosValorEsc ?? ''); setShowOutrosEsc(s.showOutrosEsc ?? true);
        setOutrosNoTotal(s.outrosNoTotal ?? true);
      };

      const handleSaveCase = () => {
        const nomeSugerido = (activeTab === 'leilao' ? clienteNomeLeilao : clienteNome) || 'Caso sem nome';
        const nome = window.prompt('Nome para identificar este caso:', nomeSugerido);
        if (!nome) return;
        const novoCaso = {
          id: Date.now().toString(36),
          nome,
          tipo: activeTab,
          data: new Date().toLocaleDateString('pt-BR'),
          state: buildCurrentState()
        };
        persistCases([novoCaso, ...savedCases]);
      };

      const handleLoadCase = (id) => {
        const found = savedCases.find(c => c.id === id);
        if (found) {
          const s = found.state;
          applyState(s); setIsCasesOpen(false);
          setMostrarIdentificacao(Boolean(s.clienteNomeLeilao || s.imovelDescLeilao));
          setMostrarOpcoes(Boolean(s.valorVenalLeilao || s.segundaPracaValue || s.maxBudget));
        }
      };

      const handleDeleteCase = (id) => {
        if (window.confirm('Excluir este caso salvo?')) {
          persistCases(savedCases.filter(c => c.id !== id));
        }
      };

      const handlePrint = () => {
        const wasDark = darkMode;
        if(wasDark) setDarkMode(false);
        setTimeout(() => {
          window.print();
          if(wasDark) setDarkMode(true);
        }, 100);
      };

      const handleReset = () => {
        if(window.confirm("Zerar valores desta aba?")) {
            if(activeTab === 'leilao') {
                setClienteNomeLeilao(''); setImovelDescLeilao('');
                setEvalValue(''); setMarketValue(''); setBidValue('');
                setEvalUnitValue(''); setMarketUnitValue(''); setBidUnitValue('');
                setMaxBudget(''); setDebts(''); setRenovation(''); setValorVenalLeilao(''); setSegundaPracaValue('');
                setAssetSize(''); setAssetType('urbano'); setVeiculoMode('leilao'); setRuralUnit('ha'); setValMode('total'); setFipeDiscount('30');
            } else {
                setClienteNome(''); setImovelDesc(''); setNegocioValor(''); setValorVenalEsc('');
                setItbiEscritura({ value: '2', type: 'percent' });
                setEscrituraManual({ value: '', type: 'fixed' });
                setRgiManual({ value: '', type: 'fixed' });
                setCertidoesEsc(''); setDiligenciasEsc('');
                setEscrituraMode('pr');
            }
        }
      };

      const getUnitLabel = () => {
        if (assetType === 'urbano') return 'm²';
        if (assetType === 'rural') {
           if (ruralUnit === 'm2') return 'm²';
           if (ruralUnit === 'ha') return 'Hectare';
           if (ALQUEIRES[ruralUnit]) return ALQUEIRES[ruralUnit].name.split(' (')[0];
        }
        return '';
      };

      const handleValModeChange = (newMode) => {
        const size = safeNumber(assetSize);
        if (size <= 0 && newMode === 'unit') return;

        if (newMode === 'unit' && valMode === 'total') {
            setBidUnitValue(safeNumber(bidValue) / size || '');
            setEvalUnitValue(safeNumber(evalValue) / size || '');
            setMarketUnitValue(safeNumber(marketValue) / size || '');
        } else if (newMode === 'total' && valMode === 'unit') {
            setBidValue(safeNumber(bidUnitValue) * size || '');
            setEvalValue(safeNumber(evalUnitValue) * size || '');
            setMarketValue(safeNumber(marketUnitValue) * size || '');
        }
        setValMode(newMode);
      };

      const getSubText = (isTotal, value, size) => {
        if (size <= 0 || value === '' || value === null) return '';
        const num = safeNumber(value);
        if (isNaN(num) || num === 0) return '';
        if (isTotal) {
          return `Equivale a ${formatMoney(num / size)} / ${getUnitLabel()}`;
        } else {
          return `Total: ${formatMoney(num * size)}`;
        }
      };

      const safeSize = safeNumber(assetSize);

      // --- Matemática: LEILÃO ---
      const calcTax = (taxState, baseValue) => {
        const val = safeNumber(taxState.value);
        if (taxState.type === 'percent') return baseValue * (val / 100);
        return val;
      };

      const safeBid = valMode === 'total' ? safeNumber(bidValue) : safeNumber(bidUnitValue) * safeSize;
      const safeEval = valMode === 'total' ? safeNumber(evalValue) : safeNumber(evalUnitValue) * safeSize;
      const safeMarket = valMode === 'total' ? safeNumber(marketValue) : safeNumber(marketUnitValue) * safeSize;

      const fipeDiscountClamped = Math.min(100, Math.max(0, safeNumber(fipeDiscount)));
      const discountedSaleValue = assetType === 'veiculo' ? safeMarket * (1 - fipeDiscountClamped / 100) : safeMarket;

      const isRegularizacao = assetType === 'veiculo' && veiculoMode === 'regularizacao';

      const leiloeiroCost = isRegularizacao ? 0 : calcTax(leiloeiro, safeBid);
      const baseItbiLeilao = Math.max(safeBid, safeNumber(valorVenalLeilao));
      const itbiCostLeilao = assetType === 'veiculo' ? 0 : calcTax(itbi, baseItbiLeilao);
      const legalCost = calcTax(legal, safeBid);

      let cartorioCostLeilao = 0;
      if (assetType !== 'veiculo') {
        if (cartorioModeLeilao === 'pr') cartorioCostLeilao = calcularRegistroPR(safeBid);
        else cartorioCostLeilao = calcTax(cartorioManualLeilao, safeBid);
      }

      const fixedCostsLeilao = safeNumber(debts) + safeNumber(renovation);
      const finalLeilao = safeBid + leiloeiroCost + itbiCostLeilao + legalCost + cartorioCostLeilao + fixedCostsLeilao;

      const lucroAbsoluto = discountedSaleValue > 0 ? discountedSaleValue - finalLeilao : 0;
      const margemLucroPorcentagem = discountedSaleValue > 0 && finalLeilao > 0 ? (lucroAbsoluto / finalLeilao) * 100 : 0;

      // Comparativo opcional com a 2ª praça (mesma fórmula do lance, com outro valor-base)
      const safeSegundaPraca = safeNumber(segundaPracaValue);
      const computeLeilaoTotal = (bid) => {
        const lCost = isRegularizacao ? 0 : calcTax(leiloeiro, bid);
        const iCost = assetType === 'veiculo' ? 0 : calcTax(itbi, Math.max(bid, safeNumber(valorVenalLeilao)));
        const legCost = calcTax(legal, bid);
        const cCost = assetType === 'veiculo' ? 0 : (cartorioModeLeilao === 'pr' ? calcularRegistroPR(bid) : calcTax(cartorioManualLeilao, bid));
        const total = bid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
        const lucro = discountedSaleValue > 0 ? discountedSaleValue - total : 0;
        return { total, lucro };
      };
      const segundaPracaResult = safeSegundaPraca > 0 ? computeLeilaoTotal(safeSegundaPraca) : null;
      const economiaSegundaPraca = segundaPracaResult ? finalLeilao - segundaPracaResult.total : 0;

      const arremateFipePercent = safeMarket > 0 && safeBid > 0 ? (safeBid / safeMarket) * 100 : 0;
      // Desconto em relação ao valor de mercado (negativo = lance acima do mercado)
      const descontoMercadoPercent = safeMarket > 0 && safeBid > 0 ? 100 - arremateFipePercent : null;
      const temVendaEstimada = discountedSaleValue > 0 && finalLeilao > 0;
      const resultadoTone = lucroAbsoluto >= 0 ? 'good' : 'bad';

      let maxBidForProfit = 0;
      if (assetType === 'veiculo' && discountedSaleValue > 0) {
          let low = 0, high = discountedSaleValue, best = 0;
          for(let i=0; i<50; i++) {
              let mid = (low + high) / 2;
              let lCost = isRegularizacao ? 0 : (leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value));
              let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);
              let total = mid + lCost + legCost + fixedCostsLeilao;
              if (total > discountedSaleValue) high = mid;
              else { best = mid; low = mid; }
          }
          maxBidForProfit = Math.floor(best);
      } else if (assetType !== 'veiculo' && safeMarket > 0) {
          let low = 0, high = safeMarket, best = 0;
          for(let i=0; i<50; i++) {
              let mid = (low + high) / 2;
              let lCost = leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value);
              let iCost = itbi.type === 'percent' ? Math.max(mid, safeNumber(valorVenalLeilao)) * (safeNumber(itbi.value)/100) : safeNumber(itbi.value);
              let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);
              let cCost = cartorioModeLeilao === 'pr' ? calcularRegistroPR(mid) : (cartorioManualLeilao.type === 'percent' ? mid * (safeNumber(cartorioManualLeilao.value)/100) : safeNumber(cartorioManualLeilao.value));
              let total = mid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
              if (total > safeMarket) high = mid;
              else { best = mid; low = mid; }
          }
          maxBidForProfit = Math.floor(best);
      }

      const handleSuggestBid = () => {
        const budget = safeNumber(maxBudget);
        let low = 0, high = budget, bestBid = 0;

        for (let i = 0; i < 50; i++) {
          let mid = (low + high) / 2;
          let lCost = isRegularizacao ? 0 : (leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value));
          let iCost = assetType === 'veiculo' ? 0 : (itbi.type === 'percent' ? Math.max(mid, safeNumber(valorVenalLeilao)) * (safeNumber(itbi.value)/100) : safeNumber(itbi.value));
          let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);

          let cCost = 0;
          if (assetType !== 'veiculo') {
            if(cartorioModeLeilao === 'pr') cCost = calcularRegistroPR(mid);
            else cCost = cartorioManualLeilao.type === 'percent' ? mid * (safeNumber(cartorioManualLeilao.value)/100) : safeNumber(cartorioManualLeilao.value);
          }

          let total = mid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
          if (total > budget) high = mid;
          else { bestBid = mid; low = mid; }
        }

        const finalBest = Math.floor(bestBid);
        if (valMode === 'total') {
            setBidValue(finalBest);
        } else {
            setBidUnitValue(finalBest / safeSize);
        }
      };

      // Conversão Rural & Urbano
      let areaInM2 = 0, areaInHa = 0, areaInAlq = 0;
      let alqName = "Alqueire";

      if (assetType === 'urbano') {
          areaInM2 = safeSize;
      } else if (assetType === 'rural' && safeSize > 0) {
        if (ruralUnit === 'm2') {
            areaInM2 = safeSize;
            areaInHa = safeSize / 10000;
            areaInAlq = safeSize / ALQUEIRES.alq_paulista.m2;
            alqName = "Alq. Paulista";
        }
        else if (ruralUnit === 'ha') {
            areaInM2 = safeSize * 10000;
            areaInHa = safeSize;
            areaInAlq = safeSize / ALQUEIRES.alq_paulista.ha;
            alqName = "Alq. Paulista";
        }
        else if (ALQUEIRES[ruralUnit]) {
            const config = ALQUEIRES[ruralUnit];
            areaInM2 = safeSize * config.m2;
            areaInHa = safeSize * config.ha;
            areaInAlq = safeSize;
            alqName = config.name.split(" (")[0];
        }
      }

      const getUnitRates = (totalValue) => {
        if (assetType === 'veiculo' || safeSize <= 0 || !totalValue) return { m2: 0, ha: 0, alq: 0 };
        return {
          m2: totalValue / areaInM2,
          ha: assetType === 'rural' ? totalValue / areaInHa : 0,
          alq: assetType === 'rural' ? totalValue / areaInAlq : 0
        };
      };

      const ratesEval = getUnitRates(safeEval);
      const ratesMarket = getUnitRates(safeMarket);
      const ratesBid = getUnitRates(safeBid);

      // --- Matemática: ESCRITURA ---
      const safeNegocio = safeNumber(negocioValor);
      const baseItbiEsc = Math.max(safeNegocio, safeNumber(valorVenalEsc));
      const itbiCostEsc = calcTax(itbiEscritura, baseItbiEsc);
      const funrejusCost = calcularFunrejus(safeNegocio);

      let lavraturaCost = 0, cartorioCostEsc = 0, escrituraExtrapolada = false;
      if (escrituraMode === 'pr') {
          const resultadoEscritura = calcularEscrituraPR(safeNegocio);
          lavraturaCost = resultadoEscritura.total;
          escrituraExtrapolada = resultadoEscritura.extrapolado;
          cartorioCostEsc = calcularRegistroPR(safeNegocio);
      } else {
          lavraturaCost = calcTax(escrituraManual, safeNegocio);
          cartorioCostEsc = calcTax(rgiManual, safeNegocio);
      }

      const safeCertidoesEsc = safeNumber(certidoesEsc);
      const safeDiligenciasEsc = safeNumber(diligenciasEsc);
      const safeOutrosEsc = safeNumber(outrosValorEsc);

      const custoInicialEsc = itbiCostEsc + lavraturaCost + funrejusCost + safeCertidoesEsc + safeDiligenciasEsc + (outrosNoTotal ? safeOutrosEsc : 0);
      const totalEscrituraComRegistro = custoInicialEsc + cartorioCostEsc;

      // Itens ocultos do orçamento não desaparecem: seu valor é embutido no Ato de
      // Escrituração para que a soma das linhas exibidas continue batendo com o subtotal.
      // "Outros" só entra aqui quando está marcado para somar ao total.
      const valorEmbutidoNoAtoEsc =
        (!showItbiEsc ? itbiCostEsc : 0) +
        (!showFunrejusEsc ? funrejusCost : 0) +
        (!showCertidoesEsc ? safeCertidoesEsc : 0) +
        (!showDiligenciasEsc ? safeDiligenciasEsc : 0) +
        (outrosNoTotal && !showOutrosEsc ? safeOutrosEsc : 0);
      const lavraturaCostExibido = showLavraturaEsc ? lavraturaCost + valorEmbutidoNoAtoEsc : lavraturaCost;

      // --- Compartilhamento ---
      const buildResumoTexto = () => {
        if (activeTab === 'leilao') {
          const linhas = [
            `*${assetType === 'veiculo' ? (isRegularizacao ? 'Análise de Compra com Regularização' : 'Análise Veicular') : 'Análise Imobiliária'}*`,
            advName + (advOab ? ` — ${advOab}` : ''),
            clienteNomeLeilao ? `Cliente: ${clienteNomeLeilao}` : null,
            imovelDescLeilao ? `Bem: ${imovelDescLeilao}` : null,
            '',
            `Lance/Compra: ${formatMoney(safeBid)}`,
            `Custo Operacional Total: ${formatMoney(finalLeilao)}`,
            discountedSaleValue > 0 ? `Lucro Estimado: ${formatMoney(lucroAbsoluto)} (${margemLucroPorcentagem > 0 ? '+' : ''}${formatCurrencyStr(margemLucroPorcentagem)}%)` : null,
            segundaPracaResult ? '' : null,
            segundaPracaResult ? `Lance na 2ª Praça: ${formatMoney(safeSegundaPraca)}` : null,
            segundaPracaResult ? `Custo Operacional (2ª Praça): ${formatMoney(segundaPracaResult.total)}` : null,
            segundaPracaResult && discountedSaleValue > 0 ? `Lucro Estimado (2ª Praça): ${formatMoney(segundaPracaResult.lucro)}` : null,
          ].filter(Boolean);
          return linhas.join('\n');
        }
        const linhas = [
          '*Memorial de Custas de Escrituração*',
          advName + (advOab ? ` — ${advOab}` : ''),
          clienteNome ? `Cliente: ${clienteNome}` : null,
          imovelDesc ? `Imóvel: ${imovelDesc}` : null,
          '',
          `Valor do Negócio: ${formatMoney(safeNegocio)}`,
          `Total sem Registro: ${formatMoney(custoInicialEsc)}`,
          `Total com Registro (RGI): ${formatMoney(totalEscrituraComRegistro)}`,
        ].filter(Boolean);
        return linhas.join('\n');
      };

      const handleCopyResumo = async () => {
        const texto = buildResumoTexto();
        try {
          await navigator.clipboard.writeText(texto);
          setToast('Resumo copiado para a área de transferência.');
        } catch (e) {
          window.prompt('Copie o resumo abaixo:', texto);
        }
      };

      const handleShareWhatsapp = () => {
        const texto = encodeURIComponent(buildResumoTexto());
        window.open(`https://wa.me/?text=${texto}`, '_blank');
      };

      // --- Planilha de cálculo (.xlsx): toda calculadora termina oferecendo esta saída ---
      const baixarPlanilhaApp = (resultado) => {
        window.CentralUI.baixarArquivo(resultado.nome, resultado.bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        window.CentralUI.avisar('Planilha de cálculo gerada.');
      };
      const baixarPdfApp = (resultado) => {
        window.CentralUI.baixarArquivo(resultado.nome, resultado.bytes, 'application/pdf');
        window.CentralUI.avisar('PDF da planilha de cálculo gerado.');
      };
      const textoTaxa = (t) => (t.type === 'percent' ? `${safeNumber(t.value).toLocaleString('pt-BR')}% sobre o lance` : `${formatMoney(safeNumber(t.value))} (valor fixo)`);

      const handleGerarPlanilhaLeilao = (formato) => {
        const Reg = window.CentralRegistro;
        const m = Reg.montador();
        const veiculo = assetType === 'veiculo';
        const titulo = veiculo ? (isRegularizacao ? 'Análise de Compra com Regularização' : 'Análise Veicular') : 'Análise Imobiliária';
        Reg.cabecalhoPlanilha(m, `Planilha de cálculo — ${titulo}`, [['Cliente', clienteNomeLeilao], [veiculo ? 'Veículo' : 'Imóvel', imovelDescLeilao]]);
        m.secao('Valores informados');
        const rLance = m.item(isRegularizacao ? 'Valor de compra acordado' : 'Valor do lance / arremate', safeBid);
        if (safeEval > 0) m.item('Valor de avaliação', safeEval);
        const rMercado = safeMarket > 0 ? m.item(veiculo ? 'Valor da tabela FIPE' : 'Valor de mercado', safeMarket) : null;
        if (veiculo && safeMarket > 0) m.item('Desvalorização na revenda', fipeDiscountClamped / 100, 'percentual');
        if (discountedSaleValue > 0) m.item(veiculo ? 'Venda estimada (FIPE − desvalorização)' : 'Valor de venda estimado', discountedSaleValue);
        m.vazio();
        m.secao('Custos de aquisição');
        const rIni = m.item('Valor de aquisição (lance)', safeBid);
        if (!isRegularizacao) m.item('Comissão do leiloeiro', leiloeiroCost, 'moeda', textoTaxa(leiloeiro));
        if (!veiculo) {
          m.item('ITBI', itbiCostLeilao, 'moeda', `${textoTaxa(itbi)}${safeNumber(valorVenalLeilao) > safeBid ? '; base: valor venal' : ''}`);
          m.item('Cartório de registro', cartorioCostLeilao, 'moeda', cartorioModeLeilao === 'pr' ? `Tabela TJ-PR (vigente desde ${VIGENCIA_TABELAS_PR})` : 'Custas manuais');
        }
        m.item(isRegularizacao ? 'Honorários judiciais e custas' : 'Assessoria jurídica', legalCost, 'moeda', textoTaxa(legal));
        if (safeNumber(debts) > 0) m.item(veiculo ? 'Multas / IPVA / débitos' : 'Dívidas do imóvel', safeNumber(debts));
        if (safeNumber(renovation) > 0) m.item(veiculo ? 'Mecânica / reparos' : 'Reformas / outros', safeNumber(renovation));
        const rFim = m.linhas.length;
        const rCusto = m.formula('CUSTO OPERACIONAL TOTAL', `SUM(C${rIni}:C${rFim})`, finalLeilao, 'destaque');
        m.vazio();
        m.secao('Resultado');
        if (discountedSaleValue > 0 && finalLeilao > 0) {
          const rVenda = m.item(veiculo ? 'Venda estimada' : 'Valor de venda estimado', discountedSaleValue);
          const rLucro = m.formula(lucroAbsoluto >= 0 ? 'Lucro líquido estimado' : 'Prejuízo estimado', `C${rVenda}-C${rCusto}`, lucroAbsoluto, 'totalMoeda');
          m.formula('ROI (lucro ÷ custo operacional)', `IF(C${rCusto}>0,C${rLucro}/C${rCusto},0)`, margemLucroPorcentagem / 100, 'percentual');
        } else {
          m.texto('Lucro e ROI', 'não calculados', 'Informe o valor de mercado e o lance.');
        }
        if (descontoMercadoPercent !== null && rMercado) m.formula('Desconto sobre o valor de mercado', `1-C${rLance}/C${rMercado}`, descontoMercadoPercent / 100, 'percentual');
        if (maxBidForProfit > 0) m.item('Teto de lance para lucro zero', maxBidForProfit);
        if (segundaPracaResult) {
          m.vazio();
          m.secao('Comparativo com a 2ª praça');
          m.item('Lance na 2ª praça', safeSegundaPraca);
          m.item('Custo operacional na 2ª praça', segundaPracaResult.total);
          if (discountedSaleValue > 0) m.item('Lucro estimado na 2ª praça', segundaPracaResult.lucro);
          m.item(economiaSegundaPraca >= 0 ? 'Economia na 2ª praça' : 'Custo a mais na 2ª praça', economiaSegundaPraca);
        }
        m.vazio();        const criterios = [
          ['Comissão do leiloeiro', isRegularizacao ? 'Não aplicável' : textoTaxa(leiloeiro)],
          ['ITBI', veiculo ? 'Não aplicável' : textoTaxa(itbi)],
          ['Cartório de registro', veiculo ? 'Não aplicável' : (cartorioModeLeilao === 'pr' ? `Tabela TJ-PR vigente desde ${VIGENCIA_TABELAS_PR}` : textoTaxa(cartorioManualLeilao))],
          [isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica', textoTaxa(legal)],
        ];
        if (formato === 'pdf') baixarPdfApp(Reg.baixarPdfSimples(m.linhas, criterios, titulo, clienteNomeLeilao || imovelDescLeilao || titulo));
        else baixarPlanilhaApp(Reg.baixarPlanilhaSimples(m.linhas, 'Cálculo', criterios, clienteNomeLeilao || imovelDescLeilao || titulo));
      };

      const handleGerarPlanilhaEscritura = (formato) => {
        const Reg = window.CentralRegistro;
        const m = Reg.montador();
        Reg.cabecalhoPlanilha(m, 'Planilha de cálculo — Memorial de Custas de Escrituração', [['Cliente', clienteNome], ['Imóvel', imovelDesc]]);
        m.secao('Base de cálculo');
        m.item('Valor do negócio', safeNegocio);
        if (safeNumber(valorVenalEsc) > 0) m.item('Valor venal (base do ITBI quando maior que o negócio)', safeNumber(valorVenalEsc));
        m.vazio();
        m.secao('Passo 1: lavratura, impostos e acessórios');
        let primeira = null;
        let somaExibida = 0;
        const add = (rotulo, valor, obs) => { const r = m.item(rotulo, valor, 'moeda', obs); if (primeira === null) primeira = r; somaExibida += valor; };
        if (showItbiEsc) add('Imposto de Transmissão (ITBI)', itbiCostEsc, safeNumber(valorVenalEsc) > safeNegocio ? 'base: valor venal' : '');
        if (showLavraturaEsc) add('Ato de Escrituração Imobiliária', lavraturaCostExibido, escrituraExtrapolada ? 'valor extrapolado da tabela' : '');
        if (showFunrejusEsc) add('Funrejus compulsório (0,2% — TJPR)', funrejusCost);
        if (showCertidoesEsc && safeNumber(certidoesEsc) > 0) add('Certidões e buscas', safeNumber(certidoesEsc));
        if (showDiligenciasEsc && safeNumber(diligenciasEsc) > 0) add('Diligências / assessoria', safeNumber(diligenciasEsc));
        if (outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0) add(outrosDescEsc || 'Outros', safeOutrosEsc);
        const fim = m.linhas.length;
        const somaConfere = primeira !== null && Math.abs(somaExibida - custoInicialEsc) < 0.005;
        const rSub = somaConfere
          ? m.formula('Subtotal sem registro', `SUM(C${primeira}:C${fim})`, custoInicialEsc, 'totalMoeda')
          : m.item('Subtotal sem registro', custoInicialEsc, 'totalMoeda', 'Inclui itens ocultos do orçamento');
        if (!outrosNoTotal && safeOutrosEsc > 0) {
          m.vazio();
          m.secao('Valor à parte (não incluído no total)');
          m.item(outrosDescEsc || 'Outros', safeOutrosEsc);
        }
        if (incluirRgi) {
          m.vazio();
          m.secao('Passo 2: Registro de Imóveis (RGI)');
          const rRgi = m.item('Emolumento de registro', cartorioCostEsc);
          m.vazio();
          m.formula('TOTAL COM REGISTRO (RGI)', `C${rSub}+C${rRgi}`, totalEscrituraComRegistro, 'destaque');
        }
        m.vazio();
        const criterios = [
          ['Modo de cálculo', escrituraMode === 'pr' ? `Automático — tabelas TJ-PR vigentes desde ${VIGENCIA_TABELAS_PR}` : 'Custas informadas manualmente'],
          ['ITBI', textoTaxa(itbiEscritura).replace(' sobre o lance', ' sobre o valor do negócio')],
        ];
        if (formato === 'pdf') baixarPdfApp(Reg.baixarPdfSimples(m.linhas, criterios, 'Memorial de Custas de Escrituração', clienteNome || imovelDesc || 'escritura'));
        else baixarPlanilhaApp(Reg.baixarPlanilhaSimples(m.linhas, 'Cálculo', criterios, clienteNome || imovelDesc || 'escritura'));
      };

      const leilaoLastStep = 2;
      const ehVeiculo = assetType === 'veiculo';
      const tituloAnalise = ehVeiculo ? (isRegularizacao ? 'Análise de compra com regularização' : 'Análise veicular') : 'Análise imobiliária';

      // Resumo das taxas (modo padrão): regra aplicada + valor, sem expor os campos de edição
      const regraTaxa = (t) => (t.type === 'percent' ? `${safeNumber(t.value).toLocaleString('pt-BR')}%` : 'valor fixo');
      const linhasTaxas = [
        !isRegularizacao && { rotulo: 'Leiloeiro', regra: regraTaxa(leiloeiro), valor: leiloeiroCost },
        !ehVeiculo && { rotulo: 'ITBI', regra: `${regraTaxa(itbi)}${safeNumber(valorVenalLeilao) > safeBid ? ' · base: valor venal' : ''}`, valor: itbiCostLeilao },
        !ehVeiculo && { rotulo: 'Registro de imóveis', regra: cartorioModeLeilao === 'pr' ? 'tabela TJ-PR' : regraTaxa(cartorioManualLeilao), valor: cartorioCostLeilao },
        { rotulo: isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica', regra: regraTaxa(legal), valor: legalCost },
      ].filter(Boolean);
      const totalTaxasLeilao = linhasTaxas.reduce((soma, l) => soma + l.valor, 0);

      // Veredito do painel: o rótulo comunica o resultado, a cor só reforça
      const veredito = !temVendaEstimada ? null
        : lucroAbsoluto < 0 ? { rotulo: 'Inviável', chip: 'bg-red-50 text-red-700 border-red-200 dark:bg-red-950/40 dark:text-red-300 dark:border-red-900/60', ponto: 'bg-red-500', fundo: 'bg-red-50 dark:bg-red-950/25', valor: 'text-red-600 dark:text-red-400' }
        : margemLucroPorcentagem < ROI_CONFORTAVEL ? { rotulo: 'Margem apertada', chip: 'bg-amber-50 text-amber-700 border-amber-200 dark:bg-amber-950/40 dark:text-amber-300 dark:border-amber-900/60', ponto: 'bg-amber-500', fundo: 'bg-amber-50/70 dark:bg-amber-950/20', valor: 'text-foreground' }
        : { rotulo: 'Viável', chip: 'bg-emerald-50 text-emerald-700 border-emerald-200 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-900/60', ponto: 'bg-emerald-500', fundo: 'bg-emerald-50/70 dark:bg-emerald-950/25', valor: 'text-emerald-700 dark:text-emerald-400' };

      const rotuloUnidade = getUnitLabel();
      const porUnidade = valMode !== 'total';

      return (
        <div className="min-h-screen pb-24 print-page-wrapper">
          {toast && (
            <div role="status" aria-live="polite" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] px-4 py-2.5 rounded-lg bg-navy-900 dark:bg-emerald-600 text-white text-sm font-semibold shadow-sm print-hide section-open">
              ✓ {toast}
            </div>
          )}

          {/* Cabeçalho da página: mesmo padrão dos demais módulos (sem segunda barra escura) */}
          <header className="max-w-5xl mx-auto px-4 sm:px-6 pt-6 sm:pt-8 print-hide">
            <div className="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-4">
              <div className="min-w-0">
                <h1 className="text-xl sm:text-2xl font-bold tracking-tight text-navy-900 dark:text-white">Calculadora de leilões</h1>
                <p className="mt-1 text-sm text-muted-foreground">
                  {activeTab === 'leilao' ? 'Custo total, lucro e ROI da arrematação de imóveis e veículos.' : 'Custas de escritura, ITBI e registro de uma compra e venda.'}
                </p>
              </div>
              <div className="flex items-center gap-2 flex-shrink-0">
                <button type="button" onClick={() => setIsCasesOpen(!isCasesOpen)} aria-expanded={isCasesOpen}
                  className={`h-9 px-3 rounded-lg border text-xs font-semibold ${isCasesOpen ? 'border-emerald-500 text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30' : 'border-input text-foreground bg-white dark:bg-white/5 hover:bg-slate-50 dark:hover:bg-white/10'}`}>
                  Casos salvos{savedCases.length > 0 ? ` (${savedCases.length})` : ''}
                </button>
                <button type="button" onClick={() => setIsSettingsOpen(!isSettingsOpen)} aria-expanded={isSettingsOpen} aria-label="Identificação do profissional" title="Identificação do profissional"
                  className={`w-9 h-9 flex items-center justify-center rounded-lg border ${isSettingsOpen ? 'border-emerald-500 text-emerald-700 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/30' : 'border-input text-slate-600 dark:text-slate-300 bg-white dark:bg-white/5 hover:bg-slate-50 dark:hover:bg-white/10'}`}>
                  <Settings className="w-4 h-4" />
                </button>
              </div>
            </div>
            <Segmentado rotulo="Tipo de cálculo" valor={activeTab} onChange={setActiveTab} className="mt-5 [&>button]:h-9 [&>button]:px-4 [&>button]:text-sm"
              opcoes={[{ valor: 'leilao', rotulo: 'Arrematação (leilão)' }, { valor: 'escritura', rotulo: 'Compra, venda e RGI' }]} />
          </header>

          <div className="max-w-5xl mx-auto px-4 sm:px-6 print-hide">
            {isSettingsOpen && (
              <div className="bg-card p-5 rounded-xl border border-border shadow-sm mt-4 section-open">
                <h3 className="text-sm font-semibold mb-4 text-foreground">Identificação do profissional</h3>
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <TextInput label="Nome do profissional ou escritório" value={advName} onChange={setAdvName} />
                  <TextInput label="Registro profissional (ex.: OAB/PR)" value={advOab} onChange={setAdvOab} />
                </div>
                <p className="text-xs text-muted-foreground mt-3">Aparece no relatório em PDF. Tabelas de custas TJ-PR vigentes desde {VIGENCIA_TABELAS_PR}; verifique as atualizações anuais antes de confiar em valores altos.</p>
              </div>
            )}

            {isCasesOpen && (
              <div className="bg-card p-5 rounded-xl border border-border shadow-sm mt-4 section-open">
                <div className="flex justify-between items-center gap-3 mb-3">
                  <h3 className="text-sm font-semibold text-foreground">Casos salvos</h3>
                  <button type="button" onClick={handleSaveCase} className="h-9 px-3 bg-navy-900 hover:bg-navy-700 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg">Salvar caso atual</button>

                {savedCases.length === 0 ? (

                        </div>
                      </li>
                    ))}
                  </ul>
                )}
              </div>

                    {ehVeiculo && (
                      <Segmentado rotulo="Modalidade" valor={veiculoMode} onChange={setVeiculoMode} className="w-full"

                    {!ehVeiculo && (
                      <div className={`grid grid-cols-1 gap-4 ${assetType === 'rural' ? 'sm:grid-cols-2' : ''}`}>

                        {assetType === 'rural' && (
                          <div>
                            <label htmlFor="unidade-rural" className={ROTULO}>Unidade</label>
                            <select id="unidade-rural" value={ruralUnit} onChange={(e) => setRuralUnit(e.target.value)} className={ENTRADA}>

                              {Object.entries(ALQUEIRES).map(([key, val]) => (
                                <option key={key} value={key}>{val.name}</option>
                              ))}
                            </select>
                          </div>
                        )}
                      </div>
                    )}

                    <Revelar titulo="Identificar cliente e bem (para o relatório)" aberto={mostrarIdentificacao} onAlternar={() => setMostrarIdentificacao(!mostrarIdentificacao)}>
                      <TextInput label={isRegularizacao ? 'Comprador / cliente' : 'Arrematante / cliente'} value={clienteNomeLeilao} onChange={setClienteNomeLeilao} placeholder="Ex.: Thiago de Souza Reis" />
                      <TextInput label={ehVeiculo ? 'Identificação do veículo' : 'Identificação do imóvel'} value={imovelDescLeilao} onChange={setImovelDescLeilao} placeholder={ehVeiculo ? 'Ex.: Toyota Corolla 2022' : 'Ex.: Casa - Centro, Loanda/PR'} />
                    </Revelar>
                  </Card>

                  {/* Etapa 2: valores */}
                  <Card title="Valores" numero={2} step={1} activeStep={leilaoStep} onStepChange={setLeilaoStep} isLast={false}
                    resumo={safeBid > 0 ? `Lance ${formatMoney(safeBid)}${safeMarket > 0 ? ` · mercado ${formatMoney(safeMarket)}` : ''}` : 'Lance, avaliação e mercado'}
                    extraHeader={!ehVeiculo && safeSize > 0 && (
                      <Segmentado rotulo="Forma de informar os valores" valor={valMode} onChange={handleValModeChange}
                        opcoes={[{ valor: 'total', rotulo: 'Total' }, { valor: 'unit', rotulo: `Por ${rotuloUnidade}` }]} />
                    )}
                  >
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div className={ehVeiculo ? '' : 'sm:col-span-2'}>
                        <MoneyInput
                          label={porUnidade ? `Lance por ${rotuloUnidade}` : (isRegularizacao ? 'Valor de compra acordado' : 'Valor do lance')}
                          value={porUnidade ? bidUnitValue : bidValue}
                          onChange={porUnidade ? setBidUnitValue : setBidValue}
                          subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? bidUnitValue : bidValue, safeSize) : undefined}
                        />
                      </div>
                      <MoneyInput
                        label={porUnidade ? `Avaliação por ${rotuloUnidade}` : 'Valor de avaliação'}
                        value={porUnidade ? evalUnitValue : evalValue}
                        onChange={porUnidade ? setEvalUnitValue : setEvalValue}
                        subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? evalUnitValue : evalValue, safeSize) : undefined}
                      />
                      <MoneyInput
                        label={ehVeiculo ? 'Tabela FIPE (cheia)' : (porUnidade ? `Mercado por ${rotuloUnidade}` : 'Valor de mercado')}
                        value={porUnidade ? marketUnitValue : marketValue}
                        onChange={porUnidade ? setMarketUnitValue : setMarketValue}
                        subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? marketUnitValue : marketValue, safeSize) : undefined}
                      />
                      {ehVeiculo && (
                        <div className="sm:col-span-2">
                          <PercentInput label="Desvalorização na revenda" value={fipeDiscount} onChange={setFipeDiscount} placeholder="30" max={100}
                            extraElement={<p className="text-xs text-muted-foreground">Venda estimada: <span className="font-semibold text-foreground tabular-nums">{formatMoney(discountedSaleValue)}</span></p>} />
                        </div>
                      )}
                    </div>

                    <Revelar titulo={ehVeiculo ? 'Mais opções: 2ª praça e orçamento' : 'Mais opções: valor venal, 2ª praça e orçamento'} aberto={mostrarOpcoes} onAlternar={() => setMostrarOpcoes(!mostrarOpcoes)}>
                      {!ehVeiculo && (
                        <MoneyInput label="Valor venal" value={valorVenalLeilao} onChange={setValorVenalLeilao}
                          subText="Se for maior que o lance, o ITBI usa este valor como base (regra comum nos municípios)." />
                      )}
                      <MoneyInput label="Lance na 2ª praça" value={segundaPracaValue} onChange={setSegundaPracaValue}
                        subText="Mostra no resultado o comparativo de custo e lucro com a 1ª praça." />
                      <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3 items-start">
                        <MoneyInput label="Orçamento máximo (teto pessoal)" value={maxBudget} onChange={setMaxBudget}
                          subText="Calcula o maior lance cujo custo total cabe no orçamento." />
                        <button type="button" onClick={handleSuggestBid} disabled={!(safeNumber(maxBudget) > 0)}
                          className="sm:mt-[26px] h-10 px-4 rounded-md border border-input bg-card text-sm font-medium text-foreground shadow-xs hover:bg-accent hover:text-accent-foreground disabled:opacity-50 disabled:pointer-events-none whitespace-nowrap outline-none transition-all focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50">
                          Calcular lance ideal
                        </button>
                      </div>
                    </Revelar>
                  </Card>

                  {/* Etapa 3: custos */}
                  <Card title="Custos" numero={3} step={2} activeStep={leilaoStep} onStepChange={setLeilaoStep} isLast={true}
                    resumo={`Taxas e custas ${formatMoney(totalTaxasLeilao)}${fixedCostsLeilao > 0 ? ` · extras ${formatMoney(fixedCostsLeilao)}` : ''}`}>
                    <div>
                      <div className="flex items-center justify-between gap-3 mb-2">
                        <span className="text-sm font-semibold text-foreground">Taxas e custas de entrada</span>
                        <button type="button" onClick={() => setEditarTaxas(!editarTaxas)} aria-expanded={editarTaxas}
                          className="text-sm font-semibold text-emerald-700 dark:text-emerald-400 hover:text-emerald-800 dark:hover:text-emerald-300">
                          {editarTaxas ? 'Concluir' : 'Editar taxas'}
                        </button>
                      </div>

                      {!editarTaxas ? (
                        <ul className="divide-y divide-border rounded-xl border border-border">
                          {linhasTaxas.map((l) => (
                            <li key={l.rotulo} className="flex items-center justify-between gap-3 px-4 py-2.5 text-sm">
                              <span className="min-w-0 truncate"><span className="text-foreground">{l.rotulo}</span> <span className="text-xs text-slate-400">· {l.regra}</span></span>
                              <span className="font-semibold tabular-nums text-foreground whitespace-nowrap">{safeBid > 0 ? formatMoney(l.valor) : '—'}</span>
                            </li>
                          ))}
                        </ul>
                      ) : (
                        <div className="space-y-4 section-open">
                          {!ehVeiculo && (
                            <div className="flex flex-wrap items-center justify-between gap-2">
                              <span className="text-xs text-muted-foreground">Registro de imóveis</span>
                              <Segmentado rotulo="Cálculo do registro de imóveis" valor={cartorioModeLeilao} onChange={setCartorioModeLeilao}
                                opcoes={[{ valor: 'pr', rotulo: 'Tabela TJ-PR' }, { valor: 'manual', rotulo: 'Manual' }]} />
                            </div>
                          )}
                          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            {!isRegularizacao && (
                              <TaxInput label="Leiloeiro" value={leiloeiro.value} type={leiloeiro.type} onChangeValue={(val) => setLeiloeiro({ ...leiloeiro, value: val })} onChangeType={(t) => setLeiloeiro({ ...leiloeiro, type: t })} description="Padrão: 5%" />
                            )}
                            {!ehVeiculo && (
                              <TaxInput label="ITBI" value={itbi.value} type={itbi.type} onChangeValue={(val) => setItbi({ ...itbi, value: val })} onChangeType={(t) => setItbi({ ...itbi, type: t })} description="Padrão: 2%" />
                            )}
                            {!ehVeiculo && (
                              cartorioModeLeilao === 'pr' ? (
                                <TaxInput label="Registro de imóveis" value={cartorioCostLeilao} type="fixed" disabled description={`Tabela TJ-PR vigente desde ${VIGENCIA_TABELAS_PR}`} />
                              ) : (
                                <TaxInput label="Registro de imóveis" value={cartorioManualLeilao.value} type={cartorioManualLeilao.type} onChangeValue={(val) => setCartorioManualLeilao({ ...cartorioManualLeilao, value: val })} onChangeType={(t) => setCartorioManualLeilao({ ...cartorioManualLeilao, type: t })} description="Custas informadas manualmente" />
                              )
                            )}
                            <TaxInput label={isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica'} value={legal.value} type={legal.type} onChangeValue={(val) => setLegal({ ...legal, value: val })} onChangeType={(t) => setLegal({ ...legal, type: t })} description={isRegularizacao ? 'Regularização' : 'Honorários'} />
                          </div>
                        </div>
                      )}
                    </div>

                    <div className="border-t border-slate-100 dark:border-slate-700/60 pt-4">
                      <span className="block text-sm font-semibold text-foreground mb-3">{isRegularizacao ? 'Débitos, documentação e reparos' : (ehVeiculo ? 'Débitos e reparos' : 'Dívidas e reformas')}</span>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <MoneyInput label={ehVeiculo ? 'Multas / IPVA / débitos' : 'Dívidas do imóvel'} value={debts} onChange={setDebts} />
                        <MoneyInput label={ehVeiculo ? 'Mecânica / reparos' : 'Reformas / outros'} value={renovation} onChange={setRenovation} />
                      </div>
                    </div>
                  </Card>
                </div>

                {/* RESULTADO (LEILÃO): fica visível ao rolar o formulário no computador */}
                <div className="lg:sticky lg:top-6 print:static">
                  <div id="pdf-leilao" className="bg-card rounded-xl border border-border shadow-sm p-5 sm:p-6 shadow-sm lg:max-h-[calc(100vh-3rem)] lg:overflow-y-auto print:max-h-none print:overflow-visible print:shadow-none print:border-none print:p-0">
                    <div className="print:hidden">
                    <div className="flex items-start justify-between gap-3 mb-5">
                      <div className="min-w-0">
                        <h2 className="text-base font-semibold text-foreground">{tituloAnalise}</h2>
                        {(clienteNomeLeilao || imovelDescLeilao) && (
                          <p className="mt-0.5 text-xs text-muted-foreground truncate">{[clienteNomeLeilao, imovelDescLeilao].filter(Boolean).join(' · ')}</p>

                      </div>
                      {veredito && safeBid > 0 && (
                        <span className={`inline-flex w-fit shrink-0 items-center justify-center gap-1.5 px-2 py-0.5 rounded-full border text-xs font-medium whitespace-nowrap ${veredito.chip}`}>

                      )}
                    </div>

                    {safeBid <= 0 ? (
                      <div className="py-10 text-center">
                        <div className="mx-auto w-11 h-11 rounded-full bg-muted flex items-center justify-center text-muted-foreground">
                          <FileText className="w-5 h-5" />
                        </div>
                        <p className="mt-3 text-sm font-semibold text-foreground">Informe o valor do lance</p>
                        <p className="mt-1 text-xs text-muted-foreground max-w-xs mx-auto">O lucro, o ROI e o custo total aparecem aqui assim que você preencher o lance e o valor de {ehVeiculo ? 'tabela FIPE' : 'mercado'}.</p>

                      <>
