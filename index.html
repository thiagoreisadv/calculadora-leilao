                              <ShowInBudgetToggle checked={showFunrejusEsc} onChange={setShowFunrejusEsc} />
                            </div>
                            <TaxInput label="Registo de Imóveis" value={Math.round(cartorioCostEsc * 100) / 100} type="fixed" disabled description="Tabela III-C/TJ-PR 2026" />
                          </>
                        ) : (
                          <>
                            <div>
                              <TaxInput label="Escritura de Compra" value={escrituraManual.value} type={escrituraManual.type} onChangeValue={(val) => setEscrituraManual({ ...escrituraManual, value: val })} onChangeType={(t) => setEscrituraManual({ ...escrituraManual, type: t })} description="Tabelionato" />
                              <ShowInBudgetToggle checked={showLavraturaEsc} onChange={setShowLavraturaEsc} />
                            </div>
                            <div>
                              <TaxInput label="Funrejus Obrigatório" value={Math.round(funrejusCost * 100) / 100} type="fixed" disabled description="Compulsório (0.2% Teto PR)" />
                              <ShowInBudgetToggle checked={showFunrejusEsc} onChange={setShowFunrejusEsc} />
                            </div>
                            <TaxInput label="Registo de Imóveis" value={rgiManual.value} type={rgiManual.type} onChangeValue={(val) => setRgiManual({ ...rgiManual, value: val })} onChangeType={(t) => setRgiManual({ ...rgiManual, type: t })} description="Cartório de Registo" />
                          </>
                        )}
                    </div>
                    {escrituraMode === 'pr' && escrituraExtrapolada && (
                      <div className="mt-2 p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 text-[11px] text-amber-800 dark:text-amber-300 font-medium">
                        A tabela oficial de emolumentos do Tabelionato de Notas (Tabela XI) não define faixas para valores acima de R$226.000,00. O valor exibido usa a última faixa conhecida como estimativa mínima — confirme o valor exato diretamente com o tabelionato.
                      </div>
                    )}

                    <div className="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800">
                        <label className="flex items-start sm:items-center gap-3 p-4 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl cursor-pointer">
                          <input type="checkbox" checked={incluirRgi} onChange={(e) => setIncluirRgi(e.target.checked)} className="w-5 h-5 mt-0.5 sm:mt-0 text-slate-900 rounded" />
                          <span className="text-sm font-bold text-slate-700 dark:text-slate-200">Incluir Registo de Imóveis (RGI) no extrato final</span>
                        </label>
                    </div>
                  </Card>

                  <Card title="Custos Acessórios" icon={FileText} step={2} activeStep={escrituraStep} onStepChange={setEscrituraStep} isLast={true}>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <MoneyInput label="Certidões e Buscas" value={certidoesEsc} onChange={setCertidoesEsc} />
                        <ShowInBudgetToggle checked={showCertidoesEsc} onChange={setShowCertidoesEsc} />
                      </div>
                      <div>
                        <MoneyInput label="Diligências / Assessoria" value={diligenciasEsc} onChange={setDiligenciasEsc} />
                        <ShowInBudgetToggle checked={showDiligenciasEsc} onChange={setShowDiligenciasEsc} />
                      </div>
                      <div className="sm:col-span-2">
                        <TextInput label="Outros (especifique)" value={outrosDescEsc} onChange={setOutrosDescEsc} placeholder="Ex: Averbação de óbito, diligência extra..." />
                      </div>
                      <div>
                        <MoneyInput label="Valor de Outros" value={outrosValorEsc} onChange={setOutrosValorEsc} />
                        <div className="flex bg-slate-200 dark:bg-slate-700 rounded-lg p-1 w-fit mt-1.5">
                          <button onClick={() => setOutrosNoTotal(true)} className={`px-3 py-1 text-[11px] font-bold rounded-md transition-colors ${outrosNoTotal ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white' : 'text-slate-500 hover:text-slate-700'}`}>Somar ao Total</button>
                          <button onClick={() => setOutrosNoTotal(false)} className={`px-3 py-1 text-[11px] font-bold rounded-md transition-colors ${!outrosNoTotal ? 'bg-white dark:bg-slate-800 text-slate-900 dark:text-white' : 'text-slate-500 hover:text-slate-700'}`}>Valor à Parte</button>
                        </div>
                        {outrosNoTotal ? (
                          <ShowInBudgetToggle checked={showOutrosEsc} onChange={setShowOutrosEsc} />
                        ) : (
                          <div className="text-[11px] text-slate-500 dark:text-slate-400 mt-1.5 ml-1">Exibido à parte, fora do total do orçamento</div>
                        )}
                      </div>
                    </div>
                  </Card>
                </div>

                {/* VISUALIZAÇÃO DO PDF / RESULTADO (ESCRITURA) */}
                <div className="space-y-4 sm:space-y-6 mt-6 lg:mt-0">
                  <div id="pdf-escritura" className="bg-white dark:bg-[#14243A] rounded-2xl border border-slate-200 dark:border-slate-700/60 p-4 sm:p-8 shadow-card print:shadow-none print:border-none print:p-0">
                    <div className="print:hidden">
                    {/* Header Limpo Sem Dados de Controle ou Configuração */}
                    <div className="mb-6 pb-4 border-b border-slate-200 dark:border-slate-800 flex flex-col sm:flex-row justify-between items-start gap-2 sm:gap-0">
                      <div>
                        <h2 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white uppercase tracking-tight">Memorial de Custas de Escrituração</h2>
                        <p className="text-xs sm:text-sm font-semibold text-slate-500 dark:text-slate-400 mt-0.5">{advName} — {advOab}</p>
                      </div>
                      <div className="text-left sm:text-right text-[11px] text-slate-400 uppercase tracking-wider font-bold">
                        Simulação Estimativa
                      </div>
                    </div>

                    {/* Dados do Cliente */}
                    {(clienteNome || imovelDesc) && (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 sm:gap-4 p-4 bg-slate-50 dark:bg-slate-800/40 rounded-xl border border-slate-100 dark:border-slate-800 mb-6">
                        {clienteNome && (
                          <div>
                            <span className="text-[11px] font-bold text-slate-400 block">Adquirente / Outorgado</span>
                            <span className="text-sm font-bold text-slate-800 dark:text-slate-200">{clienteNome}</span>
                          </div>
                        )}
                        {imovelDesc && (
                          <div>
                            <span className="text-[11px] font-bold text-slate-400 block">Objeto / Imóvel</span>
                            <span className="text-sm font-bold text-slate-800 dark:text-slate-200">{imovelDesc}</span>
                          </div>
                        )}
                      </div>
                    )}

                    <h4 className="font-bold text-slate-600 dark:text-slate-300 mb-4 text-xs">Detalhamento Financeiro</h4>

                    {/* Bloco 1: Inicial */}
                    <div className="bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl border border-slate-100 dark:border-slate-800 mb-4">
                      <h5 className="text-xs font-bold uppercase text-slate-500 mb-3">Passo 1: Lavratura, Impostos e Acessórios</h5>
                      <ul className="space-y-3 text-sm">
                        <li className="flex justify-between pb-2 border-b border-dashed border-slate-200 dark:border-slate-700">
                          <span>Base da Transação</span>
                          <span className="font-bold text-slate-900 dark:text-white">{formatMoney(safeNegocio)}</span>
                        </li>
                        {showItbiEsc && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>Imposto de Transmissão (ITBI){safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}</span>
                            <span className="font-medium">+{formatMoney(itbiCostEsc)}</span>
                          </li>
                        )}
                        {showLavraturaEsc && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>Ato de Escrituração Imobiliária</span>
                            <span className="font-medium">+{formatMoney(lavraturaCostExibido)}</span>
                          </li>
                        )}
                        {showFunrejusEsc && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>Funrejus Compulsório (0.2% - TJPR)</span>
                            <span className="font-medium">+{formatMoney(funrejusCost)}</span>
                          </li>
                        )}

                        {showCertidoesEsc && safeNumber(certidoesEsc) > 0 && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>Certidões e Buscas</span>
                            <span className="font-medium">+{formatMoney(safeNumber(certidoesEsc))}</span>
                          </li>
                        )}
                        {showDiligenciasEsc && safeNumber(diligenciasEsc) > 0 && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>Diligências / Assessoria</span>
                            <span className="font-medium">+{formatMoney(safeNumber(diligenciasEsc))}</span>
                          </li>
                        )}
                        {outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && (
                          <li className="flex justify-between text-slate-600 dark:text-slate-400">
                            <span>{outrosDescEsc || 'Outros'}</span>
                            <span className="font-medium">+{formatMoney(safeOutrosEsc)}</span>
                          </li>
                        )}

                        <li className="flex justify-between font-bold pt-3 mt-2 border-t border-slate-200 dark:border-slate-700">
                          <span className="text-slate-800 dark:text-slate-200">Subtotal Sem Registro</span>
                          <span className="text-slate-900 dark:text-white">{formatMoney(custoInicialEsc)}</span>
                        </li>
                      </ul>
                    </div>

                    {/* Valor à parte: não entra no total do orçamento */}
                    {!outrosNoTotal && safeOutrosEsc > 0 && (
                      <div className="p-4 rounded-lg border border-amber-100 dark:border-amber-900/30 bg-amber-50/50 dark:bg-amber-950/10 mb-4">
                        <h5 className="text-xs font-bold uppercase text-amber-700 dark:text-amber-400 mb-2">Valor à Parte (não incluído no total)</h5>
                        <ul className="space-y-2 text-sm">
                          <li className="flex justify-between font-medium">
                            <span className="text-amber-900 dark:text-amber-300">{outrosDescEsc || 'Outros'}</span>
                            <span className="text-amber-700 dark:text-amber-400">{formatMoney(safeOutrosEsc)}</span>
                          </li>
                        </ul>
                      </div>
                    )}

                    {/* Bloco 2: Registro */}
                    {incluirRgi && (
                      <div className="p-4 rounded-lg border border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/50 mb-4">
                        <h5 className="text-xs font-bold uppercase text-slate-500 mb-2">Passo 2: Registro de Imóveis (RGI)</h5>
                        <ul className="space-y-2 text-sm">
                          <li className="flex justify-between font-medium">
                            <span className="text-slate-700 dark:text-slate-300">Emolumento de Registro</span>
                            <span className="text-slate-900 dark:text-white">+{formatMoney(cartorioCostEsc)}</span>
                          </li>
                        </ul>
                      </div>
                    )}

                    {/* Resumo Final para PDF */}
                    <div className="bg-navy-900 text-white rounded-xl p-4 sm:p-5 mt-6">
                        <h5 className="text-xs font-bold text-slate-400 mb-4 text-center">Apurado Geral do Orçamento</h5>

                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-baseline font-extrabold gap-1 sm:gap-0">
                            <span className="text-sm sm:text-base text-slate-300">Total Estimado{incluirRgi ? ' (com Registro RGI)' : ''}</span>
                            <span className="text-2xl sm:text-3xl tabular-nums text-[#5b9bf2]">{formatMoney(totalEscrituraComRegistro)}</span>
                        </div>
                    </div>

                    <div className="mt-8 text-[11px] text-slate-500 dark:text-slate-400 text-justify leading-relaxed">
                      <strong>Nota Legal:</strong> Este relatório é de natureza estimativa e consultiva para fins de planejamento financeiro. As custas notariais e de registo seguem as tabelas de emolumentos do TJ-PR vigentes desde {VIGENCIA_TABELAS_PR} e podem variar conforme o cartório competente ou reajuste anual.
                    </div>

                    <div className="mt-8 print-hide">
                      <div className="grid grid-cols-3 gap-2">
                        <button onClick={handleReset} className="px-2 py-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold text-sm rounded-lg transition-colors">Limpar</button>
                        <button onClick={handleCopyResumo} className="px-2 py-3 bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-bold text-sm rounded-lg transition-colors">Copiar Resumo</button>
                        <button onClick={handleShareWhatsapp} className="px-2 py-3 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-800 dark:text-slate-200 font-bold text-sm rounded-lg transition-colors border border-slate-200 dark:border-slate-700">WhatsApp</button>
                      </div>
                      <button onClick={handleGerarPlanilhaEscritura} className="w-full flex items-center justify-center gap-2 py-3.5 mt-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg transition-colors">
                        Gerar planilha de cálculo
                      </button>
                      <button onClick={handlePrint} className="w-full flex items-center justify-center gap-2 py-3.5 mt-2 bg-navy-900 hover:bg-navy-700 dark:bg-emerald-600 dark:hover:bg-emerald-500 text-white dark:text-navy-900 font-bold rounded-lg transition-colors">
                        <Printer className="w-5 h-5 flex-shrink-0" /> Gerar PDF do Orçamento
                      </button>
                    </div>
                    </div>{/* fim do bloco de tela (print:hidden) */}

                    {/* ===== DOCUMENTO DE IMPRESSÃO (formal, tabelas, sem chrome de dashboard) ===== */}
                    <div className="hidden print:block text-black">
                      <div className="flex justify-between items-end border-b-2 border-black pb-3 mb-5">
                        <div>
                          <div className="text-base font-bold uppercase tracking-tight">{advName}</div>
                          <div className="text-[11px]">{advOab}</div>
                        </div>
                        <div className="text-right text-[9px] text-gray-600">
                          Documento gerado em {formatDateTime(new Date())}
                        </div>
                      </div>

                      <h1 className="text-sm font-bold uppercase text-center mb-1 tracking-wide">Memorial de Custas de Escrituração</h1>
                      <p className="text-[9px] text-center text-gray-500 mb-5">Simulação estimativa de custos de transmissão imobiliária</p>

                      {(clienteNome || imovelDesc) && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            {clienteNome && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Adquirente</td><td className="py-1 align-top">{clienteNome}</td></tr>}
                            {imovelDesc && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Imóvel</td><td className="py-1 align-top">{imovelDesc}</td></tr>}
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <thead>
                          <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 1 — Lavratura, Impostos e Acessórios</th></tr>
                        </thead>
                        <tbody>
                          <tr className="border-b border-gray-300"><td className="py-1.5 font-bold">Base da Transação</td><td className="py-1.5 text-right font-bold">{formatMoney(safeNegocio)}</td></tr>
                          {showItbiEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Imposto de Transmissão (ITBI){safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}</td><td className="py-1.5 text-right">{formatMoney(itbiCostEsc)}</td></tr>}
                          {showLavraturaEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Ato de Escrituração Imobiliária{escrituraExtrapolada ? ' *' : ''}</td><td className="py-1.5 text-right">{formatMoney(lavraturaCostExibido)}</td></tr>}
                          {showFunrejusEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Funrejus Compulsório (0,2% — TJPR)</td><td className="py-1.5 text-right">{formatMoney(funrejusCost)}</td></tr>}
                          {showCertidoesEsc && safeCertidoesEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Certidões e Buscas</td><td className="py-1.5 text-right">{formatMoney(safeCertidoesEsc)}</td></tr>}
                          {showDiligenciasEsc && safeDiligenciasEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Diligências / Assessoria</td><td className="py-1.5 text-right">{formatMoney(safeDiligenciasEsc)}</td></tr>}
                          {outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>}
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Subtotal Sem Registro</td><td className="py-2 text-right font-bold">{formatMoney(custoInicialEsc)}</td></tr>
                        </tbody>
                      </table>

                      {!outrosNoTotal && safeOutrosEsc > 0 && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Valor à Parte (não incluído no total)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      {incluirRgi && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 2 — Registro de Imóveis (RGI)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5 font-bold">Emolumento de Registro</td><td className="py-1.5 text-right font-bold">{formatMoney(cartorioCostEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <tbody>
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Total Estimado{incluirRgi ? ' (com Registro RGI)' : ''}</td><td className="py-2 text-right font-bold">{formatMoney(totalEscrituraComRegistro)}</td></tr>
                        </tbody>
                      </table>

                      <p className="text-[8px] text-gray-600 text-justify leading-relaxed mb-10">
                        <strong>Nota Legal:</strong> Este relatório é de natureza estimativa e consultiva para fins de planejamento financeiro. As custas notariais e de registo seguem as tabelas de emolumentos do TJ-PR vigentes desde {VIGENCIA_TABELAS_PR} e podem variar conforme o cartório competente ou reajuste anual.
                        {escrituraExtrapolada ? ' * A tabela oficial do Tabelionato de Notas não define faixas acima de R$226.000,00; o valor exibido é uma estimativa mínima baseada na última faixa conhecida — confirme com o tabelionato.' : ''}
                      </p>

                      <div className="flex justify-between text-[9px] avoid-break">
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">{advName}</div>
                          <div className="text-gray-600">{advOab}</div>
                        </div>
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">Assinatura do Cliente</div>
                          <div className="text-gray-600">Ciente da Estimativa</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.CentralPlataforma.Plataforma AppLeiloes={App} />);
  </script>
</body>
</html>
