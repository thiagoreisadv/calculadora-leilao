                    </div>
                    {escrituraMode === 'pr' && escrituraExtrapolada && (
                      <div className="mt-2 p-3 rounded-lg bg-amber-50 dark:bg-amber-950/30 border border-amber-200 dark:border-amber-900 text-[11px] text-amber-800 dark:text-amber-300 font-medium">
                        A tabela oficial de emolumentos do Tabelionato de Notas (Tabela XI) não define faixas para valores acima de R$226.000,00. O valor exibido usa a última faixa conhecida como estimativa mínima — confirme o valor exato diretamente com o tabelionato.
                      </div>
                    )}

                    <div className="pt-4 border-t border-slate-100 dark:border-slate-700/60">
                        <label className="flex items-center gap-3 cursor-pointer">
                          <input type="checkbox" checked={incluirRgi} onChange={(e) => setIncluirRgi(e.target.checked)} className="w-5 h-5 rounded accent-emerald-600" />
                          <span className="text-sm font-semibold text-foreground">Incluir o registro de imóveis (RGI) no total</span>
                        </label>
                    </div>
                  </Card>

                  <Card title="Custos acessórios" numero={3} step={2} activeStep={escrituraStep} onStepChange={setEscrituraStep} isLast={true}>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <MoneyInput label="Certidões e buscas" value={certidoesEsc} onChange={setCertidoesEsc} />
                        <ShowInBudgetToggle checked={showCertidoesEsc} onChange={setShowCertidoesEsc} />
                      </div>
                      <div>
                        <MoneyInput label="Diligências / assessoria" value={diligenciasEsc} onChange={setDiligenciasEsc} />
                        <ShowInBudgetToggle checked={showDiligenciasEsc} onChange={setShowDiligenciasEsc} />
                      </div>
                      <div className="sm:col-span-2">
                        <TextInput label="Outros (especifique)" value={outrosDescEsc} onChange={setOutrosDescEsc} placeholder="Ex: Averbação de óbito, diligência extra..." />
                      </div>
                      <div>
                        <MoneyInput label="Valor de Outros" value={outrosValorEsc} onChange={setOutrosValorEsc} />
                        <Segmentado rotulo="Como tratar o valor de outros" valor={outrosNoTotal ? 'total' : 'parte'} onChange={(v) => setOutrosNoTotal(v === 'total')} className="mt-2"
                          opcoes={[{ valor: 'total', rotulo: 'Somar ao total' }, { valor: 'parte', rotulo: 'Valor à parte' }]} />
                        {outrosNoTotal ? (
                          <ShowInBudgetToggle checked={showOutrosEsc} onChange={setShowOutrosEsc} />
                        ) : (
                          <div className="text-xs text-muted-foreground mt-1.5">Exibido à parte, fora do total do orçamento</div>
                        )}
                      </div>
                    </div>
                  </Card>
                </div>

                {/* VISUALIZAÇÃO DO PDF / RESULTADO (ESCRITURA) */}
                <div className="lg:sticky lg:top-6 print:static">
                  <div id="pdf-escritura" className="bg-card rounded-xl border border-border shadow-sm p-5 sm:p-6 shadow-sm lg:max-h-[calc(100vh-3rem)] lg:overflow-y-auto print:max-h-none print:overflow-visible print:shadow-none print:border-none print:p-0">
                    <div className="print:hidden">
                    {/* Header Limpo Sem Dados de Controle ou Configuração */}
                    <div className="mb-5">
                      <h2 className="text-base font-semibold text-foreground">Memorial de custas de escrituração</h2>
                      {(clienteNome || imovelDesc) && (
                        <p className="mt-0.5 text-xs text-muted-foreground truncate">{[clienteNome, imovelDesc].filter(Boolean).join(' · ')}</p>
                      )}
                    </div>

                    {/* Destaque: total estimado */}
                    <div className="rounded-xl p-4 sm:p-5 bg-muted/50 mb-5">
                      <div className="text-xs font-semibold text-slate-600 dark:text-slate-300">Total estimado{incluirRgi ? ' com registro (RGI)' : ''}</div>
                      <div key={totalEscrituraComRegistro} className="value-update mt-1 text-3xl sm:text-4xl font-bold tracking-tight tabular-nums text-foreground">{formatMoney(incluirRgi ? totalEscrituraComRegistro : custoInicialEsc)}</div>
                      <div className="mt-1 text-xs text-muted-foreground">Sobre um negócio de {formatMoney(safeNegocio)}</div>
                    </div>

                    <h4 className="font-semibold text-muted-foreground mb-3 text-xs">Detalhamento</h4>

                    {/* Bloco 1: Inicial */}
                    <div className="p-4 rounded-xl border border-border mb-4">
                      <h5 className="text-xs font-semibold text-muted-foreground mb-3">Passo 1 · Lavratura, impostos e acessórios</h5>
                      <ul className="space-y-3 text-sm">
                        <li className="flex justify-between pb-2 border-b border-dashed border-slate-200 dark:border-slate-700">
                          <span>Base da transação</span>
                          <span className="font-bold text-foreground">{formatMoney(safeNegocio)}</span>
                        </li>
                        {showItbiEsc && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>Imposto de Transmissão (ITBI){safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}</span>
                            <span className="font-medium">+{formatMoney(itbiCostEsc)}</span>
                          </li>
                        )}
                        {showLavraturaEsc && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>Ato de Escrituração Imobiliária</span>
                            <span className="font-medium">+{formatMoney(lavraturaCostExibido)}</span>
                          </li>
                        )}
                        {showFunrejusEsc && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>Funrejus Compulsório (0.2% - TJPR)</span>
                            <span className="font-medium">+{formatMoney(funrejusCost)}</span>
                          </li>
                        )}

                        {showCertidoesEsc && safeNumber(certidoesEsc) > 0 && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>Certidões e Buscas</span>
                            <span className="font-medium">+{formatMoney(safeNumber(certidoesEsc))}</span>
                          </li>
                        )}
                        {showDiligenciasEsc && safeNumber(diligenciasEsc) > 0 && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>Diligências / Assessoria</span>
                            <span className="font-medium">+{formatMoney(safeNumber(diligenciasEsc))}</span>
                          </li>
                        )}
                        {outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && (
                          <li className="flex justify-between text-muted-foreground">
                            <span>{outrosDescEsc || 'Outros'}</span>
                            <span className="font-medium">+{formatMoney(safeOutrosEsc)}</span>
                          </li>
                        )}

                        <li className="flex justify-between font-bold pt-3 mt-2 border-t border-slate-200 dark:border-slate-700">
                          <span className="text-foreground">Subtotal sem registro</span>
                          <span className="text-foreground">{formatMoney(custoInicialEsc)}</span>
                        </li>
                      </ul>
                    </div>

                    {/* Valor à parte: não entra no total do orçamento */}
                    {!outrosNoTotal && safeOutrosEsc > 0 && (
                      <div className="p-4 rounded-lg border border-amber-100 dark:border-amber-900/30 bg-amber-50/50 dark:bg-amber-950/10 mb-4">
                        <h5 className="text-xs font-semibold text-amber-700 dark:text-amber-400 mb-2">Valor à parte (não incluído no total)</h5>
                        <ul className="space-y-2 text-sm">
                          <li className="flex justify-between font-medium">
                            <span className="text-amber-900 dark:text-amber-300">{outrosDescEsc || 'Outros'}</span>
                            <span className="text-amber-700 dark:text-amber-400">{formatMoney(safeOutrosEsc)}</span>
                          </li>
                        </ul>
                      </div>
                    )}

                    {/* Bloco 2: Registro */}
                    {incluirRgi && (
                      <div className="p-4 rounded-xl border border-border mb-4">
                        <h5 className="text-xs font-semibold text-muted-foreground mb-2">Passo 2 · Registro de imóveis (RGI)</h5>
                        <ul className="space-y-2 text-sm">
                          <li className="flex justify-between font-medium">
                            <span className="text-foreground">Emolumento de Registro</span>
                            <span className="text-foreground">+{formatMoney(cartorioCostEsc)}</span>
                          </li>
                        </ul>
                      </div>
                    )}


                    {safeNegocio > 0 && (
                      <AcoesResultado rotuloPrincipal="Gerar PDF do orçamento" onPrincipal={handlePrint}
                        onExcel={() => handleGerarPlanilhaEscritura()} onPdfPlanilha={() => handleGerarPlanilhaEscritura('pdf')}
                        onCopiar={handleCopyResumo} onWhatsapp={handleShareWhatsapp} onLimpar={handleReset} />
                    )}
                    </div>{/* fim do bloco de tela (print:hidden) */}

                    {/* ===== DOCUMENTO DE IMPRESSÃO (formal, tabelas, sem chrome de dashboard) ===== */}
                    <div className="hidden print:block text-black">
                      <div className="flex justify-between items-end border-b-2 border-black pb-3 mb-5">
                        <div>
                          <div className="text-base font-bold uppercase tracking-tight">{advName}</div>
                          <div className="text-[11px]">{advOab}</div>
                        </div>
                        <div className="text-right text-[9px] text-gray-600">
                          Documento gerado em {formatDateTime(new Date())}
                        </div>
                      </div>

                      <h1 className="text-sm font-bold uppercase text-center mb-1 tracking-wide">Memorial de Custas de Escrituração</h1>
                      <p className="text-[9px] text-center text-gray-500 mb-5">Simulação estimativa de custos de transmissão imobiliária</p>

                      {(clienteNome || imovelDesc) && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            {clienteNome && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Adquirente</td><td className="py-1 align-top">{clienteNome}</td></tr>}
                            {imovelDesc && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Imóvel</td><td className="py-1 align-top">{imovelDesc}</td></tr>}
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <thead>
                          <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 1 — Lavratura, Impostos e Acessórios</th></tr>
                        </thead>
                        <tbody>
                          <tr className="border-b border-gray-300"><td className="py-1.5 font-bold">Base da Transação</td><td className="py-1.5 text-right font-bold">{formatMoney(safeNegocio)}</td></tr>
                          {showItbiEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Imposto de Transmissão (ITBI){safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}</td><td className="py-1.5 text-right">{formatMoney(itbiCostEsc)}</td></tr>}
                          {showLavraturaEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Ato de Escrituração Imobiliária{escrituraExtrapolada ? ' *' : ''}</td><td className="py-1.5 text-right">{formatMoney(lavraturaCostExibido)}</td></tr>}
                          {showFunrejusEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Funrejus Compulsório (0,2% — TJPR)</td><td className="py-1.5 text-right">{formatMoney(funrejusCost)}</td></tr>}
                          {showCertidoesEsc && safeCertidoesEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Certidões e Buscas</td><td className="py-1.5 text-right">{formatMoney(safeCertidoesEsc)}</td></tr>}
                          {showDiligenciasEsc && safeDiligenciasEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Diligências / Assessoria</td><td className="py-1.5 text-right">{formatMoney(safeDiligenciasEsc)}</td></tr>}
                          {outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>}
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Subtotal Sem Registro</td><td className="py-2 text-right font-bold">{formatMoney(custoInicialEsc)}</td></tr>
                        </tbody>
                      </table>

                      {!outrosNoTotal && safeOutrosEsc > 0 && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Valor à Parte (não incluído no total)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      {incluirRgi && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 2 — Registro de Imóveis (RGI)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5 font-bold">Emolumento de Registro</td><td className="py-1.5 text-right font-bold">{formatMoney(cartorioCostEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <tbody>
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Total Estimado{incluirRgi ? ' (com Registro RGI)' : ''}</td><td className="py-2 text-right font-bold">{formatMoney(totalEscrituraComRegistro)}</td></tr>
                        </tbody>
                      </table>

                      {escrituraExtrapolada && (
                        <p className="text-[8px] text-gray-600 text-justify leading-relaxed mb-10">* A tabela oficial do Tabelionato de Notas não define faixas acima de R$226.000,00; o valor exibido é uma estimativa mínima baseada na última faixa conhecida — confirme com o tabelionato.</p>
                      )}

                      <div className="flex justify-between text-[9px] avoid-break">
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">{advName}</div>
                          <div className="text-gray-600">{advOab}</div>
                        </div>
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">Assinatura do Cliente</div>
                          <div className="text-gray-600">Ciente da Estimativa</div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.CentralPlataforma.Plataforma AppLeiloes={App} />);
  </script>
</body>
</html>
