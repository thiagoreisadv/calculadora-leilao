      const safeSize = safeNumber(assetSize);

      // --- Matemática: LEILÃO ---
      const calcTax = (taxState, baseValue) => {
        const val = safeNumber(taxState.value);
        if (taxState.type === 'percent') return baseValue * (val / 100);
        return val;
      };

      const safeBid = valMode === 'total' ? safeNumber(bidValue) : safeNumber(bidUnitValue) * safeSize;
      const safeEval = valMode === 'total' ? safeNumber(evalValue) : safeNumber(evalUnitValue) * safeSize;
      const safeMarket = valMode === 'total' ? safeNumber(marketValue) : safeNumber(marketUnitValue) * safeSize;

      const fipeDiscountClamped = Math.min(100, Math.max(0, safeNumber(fipeDiscount)));
      const discountedSaleValue = assetType === 'veiculo' ? safeMarket * (1 - fipeDiscountClamped / 100) : safeMarket;

      const isRegularizacao = assetType === 'veiculo' && veiculoMode === 'regularizacao';

      const leiloeiroCost = isRegularizacao ? 0 : calcTax(leiloeiro, safeBid);
      const baseItbiLeilao = Math.max(safeBid, safeNumber(valorVenalLeilao));
      const itbiCostLeilao = assetType === 'veiculo' ? 0 : calcTax(itbi, baseItbiLeilao);
      const legalCost = calcTax(legal, safeBid);

      let cartorioCostLeilao = 0;
      if (assetType !== 'veiculo') {
        if (cartorioModeLeilao === 'pr') cartorioCostLeilao = calcularRegistroPR(safeBid);
        else cartorioCostLeilao = calcTax(cartorioManualLeilao, safeBid);
      }

      const fixedCostsLeilao = safeNumber(debts) + safeNumber(renovation);
      const finalLeilao = safeBid + leiloeiroCost + itbiCostLeilao + legalCost + cartorioCostLeilao + fixedCostsLeilao;

      const lucroAbsoluto = discountedSaleValue > 0 ? discountedSaleValue - finalLeilao : 0;
      const margemLucroPorcentagem = discountedSaleValue > 0 && finalLeilao > 0 ? (lucroAbsoluto / finalLeilao) * 100 : 0;

      // Comparativo opcional com a 2ª praça (mesma fórmula do lance, com outro valor-base)
      const safeSegundaPraca = safeNumber(segundaPracaValue);
      const computeLeilaoTotal = (bid) => {
        const lCost = isRegularizacao ? 0 : calcTax(leiloeiro, bid);
        const iCost = assetType === 'veiculo' ? 0 : calcTax(itbi, Math.max(bid, safeNumber(valorVenalLeilao)));
        const legCost = calcTax(legal, bid);
        const cCost = assetType === 'veiculo' ? 0 : (cartorioModeLeilao === 'pr' ? calcularRegistroPR(bid) : calcTax(cartorioManualLeilao, bid));
        const total = bid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
        const lucro = discountedSaleValue > 0 ? discountedSaleValue - total : 0;
        return { total, lucro };
      };
      const segundaPracaResult = safeSegundaPraca > 0 ? computeLeilaoTotal(safeSegundaPraca) : null;
      const economiaSegundaPraca = segundaPracaResult ? finalLeilao - segundaPracaResult.total : 0;

      const arremateFipePercent = safeMarket > 0 && safeBid > 0 ? (safeBid / safeMarket) * 100 : 0;
      // Desconto em relação ao valor de mercado (negativo = lance acima do mercado)
      const descontoMercadoPercent = safeMarket > 0 && safeBid > 0 ? 100 - arremateFipePercent : null;
      const temVendaEstimada = discountedSaleValue > 0 && finalLeilao > 0;
      const resultadoTone = lucroAbsoluto >= 0 ? 'good' : 'bad';

      let maxBidForProfit = 0;
      if (assetType === 'veiculo' && discountedSaleValue > 0) {
          let low = 0, high = discountedSaleValue, best = 0;
          for(let i=0; i<50; i++) {
              let mid = (low + high) / 2;
              let lCost = isRegularizacao ? 0 : (leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value));
              let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);
              let total = mid + lCost + legCost + fixedCostsLeilao;
              if (total > discountedSaleValue) high = mid;
              else { best = mid; low = mid; }
          }
          maxBidForProfit = Math.floor(best);
      } else if (assetType !== 'veiculo' && safeMarket > 0) {
          let low = 0, high = safeMarket, best = 0;
          for(let i=0; i<50; i++) {
              let mid = (low + high) / 2;
              let lCost = leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value);
              let iCost = itbi.type === 'percent' ? Math.max(mid, safeNumber(valorVenalLeilao)) * (safeNumber(itbi.value)/100) : safeNumber(itbi.value);
              let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);
              let cCost = cartorioModeLeilao === 'pr' ? calcularRegistroPR(mid) : (cartorioManualLeilao.type === 'percent' ? mid * (safeNumber(cartorioManualLeilao.value)/100) : safeNumber(cartorioManualLeilao.value));
              let total = mid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
              if (total > safeMarket) high = mid;
              else { best = mid; low = mid; }
          }
          maxBidForProfit = Math.floor(best);
      }

      const handleSuggestBid = () => {
        const budget = safeNumber(maxBudget);
        let low = 0, high = budget, bestBid = 0;

        for (let i = 0; i < 50; i++) {
          let mid = (low + high) / 2;
          let lCost = isRegularizacao ? 0 : (leiloeiro.type === 'percent' ? mid * (safeNumber(leiloeiro.value)/100) : safeNumber(leiloeiro.value));
          let iCost = assetType === 'veiculo' ? 0 : (itbi.type === 'percent' ? Math.max(mid, safeNumber(valorVenalLeilao)) * (safeNumber(itbi.value)/100) : safeNumber(itbi.value));
          let legCost = legal.type === 'percent' ? mid * (safeNumber(legal.value)/100) : safeNumber(legal.value);

          let cCost = 0;
          if (assetType !== 'veiculo') {
            if(cartorioModeLeilao === 'pr') cCost = calcularRegistroPR(mid);
            else cCost = cartorioManualLeilao.type === 'percent' ? mid * (safeNumber(cartorioManualLeilao.value)/100) : safeNumber(cartorioManualLeilao.value);
          }

          let total = mid + lCost + iCost + legCost + cCost + fixedCostsLeilao;
          if (total > budget) high = mid;
          else { bestBid = mid; low = mid; }
        }

        const finalBest = Math.floor(bestBid);
        if (finalBest <= 0) {
          setToast('O orçamento não cobre os custos fixos (dívidas, reformas e taxas): o lance não foi alterado.');
          return;
        }
        if (valMode === 'total') {
            setBidValue(finalBest);
        } else {
            setBidUnitValue(finalBest / safeSize);
        }
      };

      // Conversão Rural & Urbano
      let areaInM2 = 0, areaInHa = 0, areaInAlq = 0;
      let alqName = "Alqueire";

      if (assetType === 'urbano') {
          areaInM2 = safeSize;
      } else if (assetType === 'rural' && safeSize > 0) {
        if (ruralUnit === 'm2') {
            areaInM2 = safeSize;
            areaInHa = safeSize / 10000;
            areaInAlq = safeSize / ALQUEIRES.alq_paulista.m2;
            alqName = "Alq. Paulista";
        }
        else if (ruralUnit === 'ha') {
            areaInM2 = safeSize * 10000;
            areaInHa = safeSize;
            areaInAlq = safeSize / ALQUEIRES.alq_paulista.ha;
            alqName = "Alq. Paulista";
        }
        else if (ALQUEIRES[ruralUnit]) {
            const config = ALQUEIRES[ruralUnit];
            areaInM2 = safeSize * config.m2;
            areaInHa = safeSize * config.ha;
            areaInAlq = safeSize;
            alqName = config.name.split(" (")[0];
        }
      }

      const getUnitRates = (totalValue) => {
        if (assetType === 'veiculo' || safeSize <= 0 || !totalValue) return { m2: 0, ha: 0, alq: 0 };
        return {
          m2: totalValue / areaInM2,
          ha: assetType === 'rural' ? totalValue / areaInHa : 0,
          alq: assetType === 'rural' ? totalValue / areaInAlq : 0
        };
      };

      const ratesEval = getUnitRates(safeEval);
      const ratesMarket = getUnitRates(safeMarket);
      const ratesBid = getUnitRates(safeBid);

      // --- Matemática: ESCRITURA ---
      const safeNegocio = safeNumber(negocioValor);
      const baseItbiEsc = Math.max(safeNegocio, safeNumber(valorVenalEsc));
      const itbiCostEsc = calcTax(itbiEscritura, baseItbiEsc);
      const funrejusCost = calcularFunrejus(safeNegocio);

      let lavraturaCost = 0, cartorioCostEsc = 0, escrituraExtrapolada = false;
      if (escrituraMode === 'pr') {
          const resultadoEscritura = calcularEscrituraPR(safeNegocio);
          lavraturaCost = resultadoEscritura.total;
          escrituraExtrapolada = resultadoEscritura.extrapolado;
          cartorioCostEsc = calcularRegistroPR(safeNegocio);
      } else {
          lavraturaCost = calcTax(escrituraManual, safeNegocio);
          cartorioCostEsc = calcTax(rgiManual, safeNegocio);
      }

      const safeCertidoesEsc = safeNumber(certidoesEsc);
      const safeDiligenciasEsc = safeNumber(diligenciasEsc);
      const safeOutrosEsc = safeNumber(outrosValorEsc);

      const custoInicialEsc = itbiCostEsc + lavraturaCost + funrejusCost + safeCertidoesEsc + safeDiligenciasEsc + (outrosNoTotal ? safeOutrosEsc : 0);
      const totalEscrituraComRegistro = custoInicialEsc + cartorioCostEsc;

      // Itens ocultos do orçamento não desaparecem: seu valor é embutido no Ato de
      // Escrituração para que a soma das linhas exibidas continue batendo com o subtotal.
      // "Outros" só entra aqui quando está marcado para somar ao total.
      const valorEmbutidoNoAtoEsc =
        (!showItbiEsc ? itbiCostEsc : 0) +
        (!showFunrejusEsc ? funrejusCost : 0) +
        (!showCertidoesEsc ? safeCertidoesEsc : 0) +
        (!showDiligenciasEsc ? safeDiligenciasEsc : 0) +
        (outrosNoTotal && !showOutrosEsc ? safeOutrosEsc : 0);
      const lavraturaCostExibido = showLavraturaEsc ? lavraturaCost + valorEmbutidoNoAtoEsc : lavraturaCost;

      // --- Compartilhamento ---
      const buildResumoTexto = () => {
        if (activeTab === 'leilao') {
          const linhas = [
            `*${assetType === 'veiculo' ? (isRegularizacao ? 'Análise de Compra com Regularização' : 'Análise Veicular') : 'Análise Imobiliária'}*`,
            advName + (advOab ? ` — ${advOab}` : ''),
            clienteNomeLeilao ? `Cliente: ${clienteNomeLeilao}` : null,
            imovelDescLeilao ? `Bem: ${imovelDescLeilao}` : null,
            '',
            `Lance/Compra: ${formatMoney(safeBid)}`,
            `Custo Operacional Total: ${formatMoney(finalLeilao)}`,
            discountedSaleValue > 0 ? `Lucro Estimado: ${formatMoney(lucroAbsoluto)} (${margemLucroPorcentagem > 0 ? '+' : ''}${formatCurrencyStr(margemLucroPorcentagem)}%)` : null,
            segundaPracaResult ? '' : null,
            segundaPracaResult ? `Lance na 2ª Praça: ${formatMoney(safeSegundaPraca)}` : null,
            segundaPracaResult ? `Custo Operacional (2ª Praça): ${formatMoney(segundaPracaResult.total)}` : null,
            segundaPracaResult && discountedSaleValue > 0 ? `Lucro Estimado (2ª Praça): ${formatMoney(segundaPracaResult.lucro)}` : null,
          ].filter(Boolean);
          return linhas.join('\n');
        }
        const linhas = [
          '*Memorial de Custas de Escrituração*',
          advName + (advOab ? ` — ${advOab}` : ''),
          clienteNome ? `Cliente: ${clienteNome}` : null,
          imovelDesc ? `Imóvel: ${imovelDesc}` : null,
          '',
          `Valor do Negócio: ${formatMoney(safeNegocio)}`,
          `Total sem Registro: ${formatMoney(custoInicialEsc)}`,
          `Total com Registro (RGI): ${formatMoney(totalEscrituraComRegistro)}`,
        ].filter(Boolean);
        return linhas.join('\n');
      };

      const handleCopyResumo = async () => {
        const texto = buildResumoTexto();
        try {
          await navigator.clipboard.writeText(texto);
          setToast('Resumo copiado para a área de transferência.');
        } catch (e) {
          window.prompt('Copie o resumo abaixo:', texto);
        }
      };

      const handleShareWhatsapp = () => {
        const texto = encodeURIComponent(buildResumoTexto());
        window.open(`https://wa.me/?text=${texto}`, '_blank');
      };

      // --- Planilha de cálculo (.xlsx): toda calculadora termina oferecendo esta saída ---
      const baixarPlanilhaApp = (resultado) => {
        window.CentralUI.baixarArquivo(resultado.nome, resultado.bytes, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
        window.CentralUI.avisar('Planilha de cálculo gerada.');
      };
      const baixarPdfApp = (resultado) => {
        window.CentralUI.baixarArquivo(resultado.nome, resultado.bytes, 'application/pdf');
        window.CentralUI.avisar('PDF da planilha de cálculo gerado.');
      };
      const textoTaxa = (t) => (t.type === 'percent' ? `${safeNumber(t.value).toLocaleString('pt-BR')}% sobre o lance` : `${formatMoney(safeNumber(t.value))} (valor fixo)`);

      const handleGerarPlanilhaLeilao = (formato) => {
        const Reg = window.CentralRegistro;
        const m = Reg.montador();
        const veiculo = assetType === 'veiculo';
        const titulo = veiculo ? (isRegularizacao ? 'Análise de Compra com Regularização' : 'Análise Veicular') : 'Análise Imobiliária';
        Reg.cabecalhoPlanilha(m, `Planilha de cálculo — ${titulo}`, [['Cliente', clienteNomeLeilao], [veiculo ? 'Veículo' : 'Imóvel', imovelDescLeilao]]);
        m.secao('Valores informados');
        const rLance = m.item(isRegularizacao ? 'Valor de compra acordado' : 'Valor do lance / arremate', safeBid);
        if (safeEval > 0) m.item('Valor de avaliação', safeEval);
        const rMercado = safeMarket > 0 ? m.item(veiculo ? 'Valor da tabela FIPE' : 'Valor de mercado', safeMarket) : null;
        if (veiculo && safeMarket > 0) m.item('Desvalorização na revenda', fipeDiscountClamped / 100, 'percentual');
        if (discountedSaleValue > 0) m.item(veiculo ? 'Venda estimada (FIPE − desvalorização)' : 'Valor de venda estimado', discountedSaleValue);
        m.vazio();
        m.secao('Custos de aquisição');
        const rIni = m.item('Valor de aquisição (lance)', safeBid);
        if (!isRegularizacao) m.item('Comissão do leiloeiro', leiloeiroCost, 'moeda', textoTaxa(leiloeiro));
        if (!veiculo) {
          m.item('ITBI', itbiCostLeilao, 'moeda', `${textoTaxa(itbi)}${safeNumber(valorVenalLeilao) > safeBid ? '; base: valor venal' : ''}`);
          m.item('Cartório de registro', cartorioCostLeilao, 'moeda', cartorioModeLeilao === 'pr' ? `Tabela TJ-PR (vigente desde ${VIGENCIA_TABELAS_PR})` : 'Custas manuais');
        }
        m.item(isRegularizacao ? 'Honorários judiciais e custas' : 'Assessoria jurídica', legalCost, 'moeda', textoTaxa(legal));
        if (safeNumber(debts) > 0) m.item(veiculo ? 'Multas / IPVA / débitos' : 'Dívidas do imóvel', safeNumber(debts));
        if (safeNumber(renovation) > 0) m.item(veiculo ? 'Mecânica / reparos' : 'Reformas / outros', safeNumber(renovation));
        const rFim = m.linhas.length;
        const rCusto = m.formula('CUSTO OPERACIONAL TOTAL', `SUM(C${rIni}:C${rFim})`, finalLeilao, 'destaque');
        m.vazio();
        m.secao('Resultado');
        if (discountedSaleValue > 0 && finalLeilao > 0) {
          const rVenda = m.item(veiculo ? 'Venda estimada' : 'Valor de venda estimado', discountedSaleValue);
          const rLucro = m.formula(lucroAbsoluto >= 0 ? 'Lucro líquido estimado' : 'Prejuízo estimado', `C${rVenda}-C${rCusto}`, lucroAbsoluto, 'totalMoeda');
          m.formula('ROI (lucro ÷ custo operacional)', `IF(C${rCusto}>0,C${rLucro}/C${rCusto},0)`, margemLucroPorcentagem / 100, 'percentual');
        } else {
          m.texto('Lucro e ROI', 'não calculados', 'Informe o valor de mercado e o lance.');
        }
        if (descontoMercadoPercent !== null && rMercado) m.formula('Desconto sobre o valor de mercado', `1-C${rLance}/C${rMercado}`, descontoMercadoPercent / 100, 'percentual');
        if (maxBidForProfit > 0) m.item('Teto de lance para lucro zero', maxBidForProfit);
        if (segundaPracaResult) {
          m.vazio();
          m.secao('Comparativo com a 2ª praça');
          m.item('Lance na 2ª praça', safeSegundaPraca);
          m.item('Custo operacional na 2ª praça', segundaPracaResult.total);
          if (discountedSaleValue > 0) m.item('Lucro estimado na 2ª praça', segundaPracaResult.lucro);
          m.item(economiaSegundaPraca >= 0 ? 'Economia na 2ª praça' : 'Custo a mais na 2ª praça', economiaSegundaPraca);
        }
        m.vazio();        const criterios = [
          ['Comissão do leiloeiro', isRegularizacao ? 'Não aplicável' : textoTaxa(leiloeiro)],
          ['ITBI', veiculo ? 'Não aplicável' : textoTaxa(itbi)],
          ['Cartório de registro', veiculo ? 'Não aplicável' : (cartorioModeLeilao === 'pr' ? `Tabela TJ-PR vigente desde ${VIGENCIA_TABELAS_PR}` : textoTaxa(cartorioManualLeilao))],
          [isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica', textoTaxa(legal)],
        ];
        if (formato === 'pdf') baixarPdfApp(Reg.baixarPdfSimples(m.linhas, criterios, titulo, clienteNomeLeilao || imovelDescLeilao || titulo));
        else baixarPlanilhaApp(Reg.baixarPlanilhaSimples(m.linhas, 'Cálculo', criterios, clienteNomeLeilao || imovelDescLeilao || titulo));
      };

      const handleGerarPlanilhaEscritura = (formato) => {
        const Reg = window.CentralRegistro;
        const m = Reg.montador();
        Reg.cabecalhoPlanilha(m, 'Planilha de cálculo — Memorial de Custas de Escrituração', [['Cliente', clienteNome], ['Imóvel', imovelDesc]]);
        m.secao('Base de cálculo');
        m.item('Valor do negócio', safeNegocio);
        if (safeNumber(valorVenalEsc) > 0) m.item('Valor venal (base do ITBI quando maior que o negócio)', safeNumber(valorVenalEsc));
        m.vazio();
        m.secao('Passo 1: lavratura, impostos e acessórios');
        let primeira = null;
        let somaExibida = 0;
        const add = (rotulo, valor, obs) => { const r = m.item(rotulo, valor, 'moeda', obs); if (primeira === null) primeira = r; somaExibida += valor; };
        if (showItbiEsc) add('Imposto de Transmissão (ITBI)', itbiCostEsc, safeNumber(valorVenalEsc) > safeNegocio ? 'base: valor venal' : '');
        if (showLavraturaEsc) add('Ato de Escrituração Imobiliária', lavraturaCostExibido, escrituraExtrapolada ? 'valor extrapolado da tabela' : '');
        if (showFunrejusEsc) add('Funrejus compulsório (0,2% — TJPR)', funrejusCost);
        if (showCertidoesEsc && safeNumber(certidoesEsc) > 0) add('Certidões e buscas', safeNumber(certidoesEsc));
        if (showDiligenciasEsc && safeNumber(diligenciasEsc) > 0) add('Diligências / assessoria', safeNumber(diligenciasEsc));
        if (outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0) add(outrosDescEsc || 'Outros', safeOutrosEsc);
        const fim = m.linhas.length;
        const somaConfere = primeira !== null && Math.abs(somaExibida - custoInicialEsc) < 0.005;
        const rSub = somaConfere
          ? m.formula('Subtotal sem registro', `SUM(C${primeira}:C${fim})`, custoInicialEsc, 'totalMoeda')
          : m.item('Subtotal sem registro', custoInicialEsc, 'totalMoeda', 'Inclui itens ocultos do orçamento');
        if (!outrosNoTotal && safeOutrosEsc > 0) {
          m.vazio();
          m.secao('Valor à parte (não incluído no total)');
          m.item(outrosDescEsc || 'Outros', safeOutrosEsc);
        }
        if (incluirRgi) {
          m.vazio();
          m.secao('Passo 2: Registro de Imóveis (RGI)');
          const rRgi = m.item('Emolumento de registro', cartorioCostEsc);
          m.vazio();
          m.formula('TOTAL COM REGISTRO (RGI)', `C${rSub}+C${rRgi}`, totalEscrituraComRegistro, 'destaque');
        }
        m.vazio();
        const criterios = [
          ['Modo de cálculo', escrituraMode === 'pr' ? `Automático — tabelas TJ-PR vigentes desde ${VIGENCIA_TABELAS_PR}` : 'Custas informadas manualmente'],
          ['ITBI', textoTaxa(itbiEscritura).replace(' sobre o lance', ' sobre o valor do negócio')],
        ];
        if (formato === 'pdf') baixarPdfApp(Reg.baixarPdfSimples(m.linhas, criterios, 'Memorial de Custas de Escrituração', clienteNome || imovelDesc || 'escritura'));
        else baixarPlanilhaApp(Reg.baixarPlanilhaSimples(m.linhas, 'Cálculo', criterios, clienteNome || imovelDesc || 'escritura'));
      };

      const ehVeiculo = assetType === 'veiculo';
      const eLeilao = activeTab === 'leilao';
      const rotuloUnidade = getUnitLabel();
      const porUnidade = valMode !== 'total';
      const [abaLeilao, setAbaLeilao] = useState('bem');
      const [abaEscritura, setAbaEscritura] = useState('negocio');

      // ---- Painel de resultado: leilão ----
      const orcamentoMax = safeNumber(maxBudget);
      const acimaDoOrcamento = orcamentoMax > 0 && finalLeilao > orcamentoMax && safeBid > 0;
      const statusLeilao = safeBid <= 0 ? null
        : acimaDoOrcamento ? { tom: 'ruim', texto: 'Acima do orçamento máximo' }
        : !temVendaEstimada ? null
        : lucroAbsoluto < 0 ? { tom: 'ruim', texto: 'Prejuízo estimado' }
        : margemLucroPorcentagem >= ROI_CONFORTAVEL ? { tom: 'bom', texto: `Margem confortável (ROI ≥ ${ROI_CONFORTAVEL}%)` }
        : { tom: 'aviso', texto: 'Margem apertada' };
      const rotuloMercado = ehVeiculo ? 'tabela FIPE' : 'mercado';
      const linhasLeilao = [
        { l: isRegularizacao ? 'Compra acordada' : 'Lance', v: formatMoney(safeBid), n: safeBid },
        !isRegularizacao && { l: 'Leiloeiro', v: formatMoney(leiloeiroCost), n: leiloeiroCost },
        !ehVeiculo && { l: 'ITBI', v: formatMoney(itbiCostLeilao), n: itbiCostLeilao },
        !ehVeiculo && { l: 'Registro de imóveis', v: formatMoney(cartorioCostLeilao), n: cartorioCostLeilao },
        { l: isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica', v: formatMoney(legalCost), n: legalCost },
        { l: ehVeiculo ? 'Multas / IPVA / débitos' : 'Dívidas do imóvel', v: formatMoney(safeNumber(debts)), n: safeNumber(debts) },
        { l: ehVeiculo ? 'Mecânica / reparos' : 'Reformas / outros', v: formatMoney(safeNumber(renovation)), n: safeNumber(renovation) },
      ].filter(Boolean);

      const painelLeilao = (
        <PainelResultado
          rotulo={temVendaEstimada ? (lucroAbsoluto >= 0 ? 'Lucro estimado' : 'Prejuízo estimado') : (safeBid > 0 ? 'Investimento total' : 'Lucro estimado')}
          valor={safeBid <= 0 ? '—' : formatMoney(temVendaEstimada ? lucroAbsoluto : finalLeilao)}
          tomValor={temVendaEstimada && lucroAbsoluto < 0 ? 'ruim' : undefined}
          status={statusLeilao}
          kpis={[
            { l: 'ROI', v: temVendaEstimada ? `${margemLucroPorcentagem > 0 ? '+' : ''}${formatPercent(margemLucroPorcentagem)}` : '—', tom: temVendaEstimada ? (lucroAbsoluto >= 0 ? 'bom' : 'ruim') : undefined },
            { l: 'Desconto', v: descontoMercadoPercent !== null ? formatPercent(descontoMercadoPercent) : '—', tom: descontoMercadoPercent === null ? undefined : (descontoMercadoPercent >= 0 ? 'bom' : 'ruim') },
            { l: 'Investimento', v: safeBid > 0 ? formatMoney(finalLeilao) : '—' },
          ]}
          linhas={safeBid > 0 ? linhasLeilao : []}
          acoes={
            <AcoesPainel
              principal={{ rotulo: 'Gerar relatório (PDF)', icone: 'pdf', onClick: handlePrint, desabilitado: safeBid <= 0 }}
              linha={[
                { rotulo: 'Excel', icone: 'xls', onClick: () => handleGerarPlanilhaLeilao(), desabilitado: safeBid <= 0 },
                { rotulo: 'Exportar', icone: 'baixar', desabilitado: safeBid <= 0, menu: [
                  { rotulo: 'Planilha de cálculo (PDF)', detalhe: 'Tabela pronta para enviar', onClick: () => handleGerarPlanilhaLeilao('pdf') },
                  { rotulo: 'Copiar resumo', detalhe: 'Texto curto para colar', onClick: handleCopyResumo },
                  { rotulo: 'Enviar pelo WhatsApp', onClick: handleShareWhatsapp },
                  { rotulo: 'Salvar como caso', detalhe: 'Guarda este cálculo em "Casos salvos"', onClick: handleSaveCase },
                ] },
              ]}
              onLimpar={handleReset}
            />
          }
        >
          {safeBid <= 0 && <p className="mt-4 text-[12.5px] text-muted-foreground">Informe o valor do lance e o de {rotuloMercado} para ver o lucro, o ROI e o custo total.</p>}
          {safeBid > 0 && !temVendaEstimada && <p className="mt-4 text-[12.5px] text-warning">Informe o valor de {rotuloMercado} para calcular lucro, ROI e desconto.</p>}
          {descontoMercadoPercent !== null && descontoMercadoPercent < 0 && <p className="mt-4 text-[12.5px] text-warning">Atenção: o lance está acima do valor de {rotuloMercado} informado.</p>}
          {temVendaEstimada && maxBidForProfit > 0 && (
            <div className="mt-4 flex items-center justify-between gap-3 text-[13px]">
              <span className="text-muted-foreground">Lance máximo sem prejuízo</span>
              <span className="tabular-nums text-foreground">{formatMoney(maxBidForProfit)}</span>
            </div>
          )}
          {ehVeiculo && safeMarket > 0 && (
            <p className="mt-3 text-xs text-muted-foreground">FIPE {formatMoney(safeMarket)} · {isRegularizacao ? 'compra' : 'arremate'} = {arremateFipePercent.toFixed(1).replace('.', ',')}% da FIPE{safeEval > 0 ? ` · avaliação ${formatMoney(safeEval)}` : ''}</p>
          )}
          {segundaPracaResult && (
            <div className="mt-4 rounded-[10px] border border-border px-3.5 py-3">
              <h4 className="text-xs text-muted-foreground mb-2">Comparativo com a 2ª praça ({formatMoney(safeSegundaPraca)})</h4>
              <ul className="space-y-1.5 text-[13px]">
                <li className="flex justify-between gap-3"><span className="text-muted-foreground">Custo total</span><span className="tabular-nums text-foreground">{formatMoney(segundaPracaResult.total)}</span></li>
                <li className="flex justify-between gap-3"><span className="text-muted-foreground">{economiaSegundaPraca >= 0 ? 'Economia sobre a 1ª praça' : 'Custo a mais que a 1ª praça'}</span><span className={`tabular-nums ${economiaSegundaPraca >= 0 ? 'text-success' : 'text-destructive'}`}>{formatMoney(Math.abs(economiaSegundaPraca))}</span></li>
                {discountedSaleValue > 0 && <li className="flex justify-between gap-3"><span className="text-muted-foreground">Lucro estimado</span><span className={`tabular-nums ${segundaPracaResult.lucro >= 0 ? 'text-success' : 'text-destructive'}`}>{formatMoney(segundaPracaResult.lucro)}</span></li>}
              </ul>
            </div>
          )}
        </PainelResultado>
      );

      // Comparação de preço por área (imóveis): consulta, fica abaixo do formulário
      const detalhesLeilao = (!ehVeiculo && safeSize > 0 && safeBid > 0) ? (
        <section className="bg-card border border-border rounded-[14px] px-4 sm:px-6 py-5 print-hide">
          <h2 className="text-[15px] font-medium text-foreground">Comparação de preço por área</h2>
          <p className="mt-1 mb-3 text-[13px] text-muted-foreground">
            {assetType === 'rural' ? `${formatCurrencyStr(areaInM2)} m² · ${formatCurrencyStr(areaInHa)} ha · ${formatCurrencyStr(areaInAlq)} ${alqName}` : `${formatCurrencyStr(areaInM2)} m²`}
          </p>
          <Tabela legenda="Preço por área"
            colunas={['Métrica', 'Por m²', ...(assetType === 'rural' ? ['Por ha', `Por ${alqName}`] : [])]} numericas={assetType === 'rural' ? [1, 2, 3] : [1]}
            linhas={[
              safeEval > 0 && ['Avaliação', formatMoney(ratesEval.m2), ...(assetType === 'rural' ? [formatMoney(ratesEval.ha), formatMoney(ratesEval.alq)] : [])],
              safeMarket > 0 && ['Mercado', formatMoney(ratesMarket.m2), ...(assetType === 'rural' ? [formatMoney(ratesMarket.ha), formatMoney(ratesMarket.alq)] : [])],
              ['Arrematação', formatMoney(ratesBid.m2), ...(assetType === 'rural' ? [formatMoney(ratesBid.ha), formatMoney(ratesBid.alq)] : [])],
            ].filter(Boolean)} />
        </section>
      ) : null;

      // ---- Abas do formulário: leilão ----
      const abasLeilao = [
        { id: 'bem', rotulo: 'Bem', icone: 'casa', conteudo: (
          <Grade>
            <Col span={6}>
              <Segmentado rotulo="Tipo de bem" valor={assetType} onChange={setAssetType} cheio
                opcoes={[{ valor: 'urbano', rotulo: 'Urbano', icone: 'casa' }, { valor: 'rural', rotulo: 'Rural', icone: 'arvore' }, { valor: 'veiculo', rotulo: 'Veículo', icone: 'carro' }]} />
            </Col>
            {ehVeiculo && (
              <Col span={6}>
                <Segmentado rotulo="Modalidade" valor={veiculoMode} onChange={setVeiculoMode} cheio
                  opcoes={[{ valor: 'leilao', rotulo: 'Arrematação em leilão' }, { valor: 'regularizacao', rotulo: 'Compra com regularização judicial' }]} />
              </Col>
            )}
            {!ehVeiculo && (
              <Col span={3}>
                <DecimalInput label={assetType === 'urbano' ? 'Área total' : 'Tamanho total'} value={assetSize} onChange={setAssetSize} placeholder="Ex.: 250,50"
                  sufixo={assetType === 'urbano' ? 'm²' : undefined} subText={assetType === 'urbano' ? 'Opcional. Permite informar valores por m².' : undefined} />
              </Col>
            )}
            {assetType === 'rural' && (
              <Col span={3}>
                <label htmlFor="unidade-rural" className={ROTULO}>Unidade</label>
                <select id="unidade-rural" value={ruralUnit} onChange={(e) => setRuralUnit(e.target.value)} className={ENTRADA}>
                  <option value="m2">Metro quadrado (m²)</option>
                  <option value="ha">Hectare (ha)</option>
                  {Object.entries(ALQUEIRES).map(([key, val]) => <option key={key} value={key}>{val.name}</option>)}
                </select>
              </Col>
            )}
            <Col span={3}><TextInput label={isRegularizacao ? 'Comprador / cliente' : 'Cliente / arrematante'} value={clienteNomeLeilao} onChange={setClienteNomeLeilao} placeholder="Ex.: João Silva" /></Col>
            <Col span={3}><TextInput label={ehVeiculo ? 'Descrição do veículo' : 'Descrição do imóvel'} value={imovelDescLeilao} onChange={setImovelDescLeilao} placeholder={ehVeiculo ? 'Ex.: Toyota Corolla 2022' : 'Ex.: Chácara São Pedro – Loanda/PR'} /></Col>
          </Grade>
        ) },
        { id: 'valores', rotulo: 'Valores', icone: 'moeda', conteudo: (
          <Grade>
            {!ehVeiculo && safeSize > 0 && (
              <Col span={6}>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[12.5px] text-muted-foreground">Informar os valores</span>
                  <Segmentado rotulo="Forma de informar os valores" valor={valMode} onChange={handleValModeChange}
                    opcoes={[{ valor: 'total', rotulo: 'Total' }, { valor: 'unit', rotulo: `Por ${rotuloUnidade}` }]} />
                </div>
              </Col>
            )}
            <Col span={2}>
              <MoneyInput label={porUnidade ? `Lance por ${rotuloUnidade}` : (isRegularizacao ? 'Valor de compra acordado' : 'Lance')}
                value={porUnidade ? bidUnitValue : bidValue} onChange={porUnidade ? setBidUnitValue : setBidValue}
                subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? bidUnitValue : bidValue, safeSize) : undefined} />
            </Col>
            <Col span={2}>
              <MoneyInput label={porUnidade ? `Avaliação por ${rotuloUnidade}` : 'Valor de avaliação'}
                value={porUnidade ? evalUnitValue : evalValue} onChange={porUnidade ? setEvalUnitValue : setEvalValue}
                subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? evalUnitValue : evalValue, safeSize) : undefined} />
            </Col>
            <Col span={2}>
              <MoneyInput label={ehVeiculo ? 'Tabela FIPE (cheia)' : (porUnidade ? `Mercado por ${rotuloUnidade}` : 'Valor de mercado')}
                value={porUnidade ? marketUnitValue : marketValue} onChange={porUnidade ? setMarketUnitValue : setMarketValue}
                subText={!ehVeiculo ? getSubText(!porUnidade, porUnidade ? marketUnitValue : marketValue, safeSize) : undefined} />
            </Col>
            {ehVeiculo ? (
              <Col span={2}>
                <PercentInput label="Desvalorização na revenda" value={fipeDiscount} onChange={setFipeDiscount} placeholder="30" max={100}
                  extraElement={<p className="text-[11.5px] text-muted-foreground">Venda estimada: <span className="tabular-nums text-foreground">{formatMoney(discountedSaleValue)}</span></p>} />
              </Col>
            ) : (
              <Col span={2}><MoneyInput label="Valor venal" value={valorVenalLeilao} onChange={setValorVenalLeilao} subText="Se maior que o lance, o ITBI usa esta base." /></Col>
            )}
            <Col span={2}><MoneyInput label="Lance na 2ª praça" value={segundaPracaValue} onChange={setSegundaPracaValue} subText="Compara custo e lucro com a 1ª praça." /></Col>
            <Col span={2}>
              <MoneyInput label="Orçamento máximo" value={maxBudget} onChange={setMaxBudget} subText="Teto pessoal de investimento." />
              <Botao onClick={handleSuggestBid} disabled={!(safeNumber(maxBudget) > 0)} className="w-full mt-2" tamanho="sm">Calcular lance ideal</Botao>
            </Col>
          </Grade>
        ) },
        { id: 'custos', rotulo: 'Custos', icone: 'debito', conteudo: (
          <Grade>
            {!ehVeiculo && (
              <Col span={6}>
                <div className="flex items-center justify-between gap-3">
                  <span className="text-[12.5px] text-muted-foreground">Registro de imóveis</span>
                  <Segmentado rotulo="Cálculo do registro de imóveis" valor={cartorioModeLeilao} onChange={setCartorioModeLeilao}
                    opcoes={[{ valor: 'pr', rotulo: 'Tabela TJ-PR' }, { valor: 'manual', rotulo: 'Manual' }]} />
                </div>
              </Col>
            )}
            {!isRegularizacao && <Col span={2}><TaxInput label="Leiloeiro" value={leiloeiro.value} type={leiloeiro.type} onChangeValue={(val) => setLeiloeiro({ ...leiloeiro, value: val })} onChangeType={(t) => setLeiloeiro({ ...leiloeiro, type: t })} description="Padrão: 5%" /></Col>}
            {!ehVeiculo && <Col span={2}><TaxInput label="ITBI" value={itbi.value} type={itbi.type} onChangeValue={(val) => setItbi({ ...itbi, value: val })} onChangeType={(t) => setItbi({ ...itbi, type: t })} description="Padrão: 2%" /></Col>}
            {!ehVeiculo && (
              <Col span={2}>
                {cartorioModeLeilao === 'pr'
                  ? <TaxInput label="Registro de imóveis" value={cartorioCostLeilao} type="fixed" disabled description={`Tabela TJ-PR vigente desde ${VIGENCIA_TABELAS_PR}`} />
                  : <TaxInput label="Registro de imóveis" value={cartorioManualLeilao.value} type={cartorioManualLeilao.type} onChangeValue={(val) => setCartorioManualLeilao({ ...cartorioManualLeilao, value: val })} onChangeType={(t) => setCartorioManualLeilao({ ...cartorioManualLeilao, type: t })} description="Custas informadas manualmente" />}
              </Col>
            )}
            <Col span={2}><TaxInput label={isRegularizacao ? 'Honorários judiciais' : 'Assessoria jurídica'} value={legal.value} type={legal.type} onChangeValue={(val) => setLegal({ ...legal, value: val })} onChangeType={(t) => setLegal({ ...legal, type: t })} description={isRegularizacao ? 'Regularização' : 'Honorários'} /></Col>
            <Col span={2}><MoneyInput label={ehVeiculo ? 'Multas / IPVA / débitos' : 'Dívidas do imóvel'} value={debts} onChange={setDebts} /></Col>
            <Col span={2}><MoneyInput label={ehVeiculo ? 'Mecânica / reparos' : 'Reformas / outros'} value={renovation} onChange={setRenovation} /></Col>
          </Grade>
        ) },
      ];

      // ---- Painel de resultado: escritura ----
      const totalEscrituraTela = incluirRgi ? totalEscrituraComRegistro : custoInicialEsc;
      const baseItbiTela = Math.max(safeNegocio, safeNumber(valorVenalEsc));
      const linhasEscritura = [
        showItbiEsc && { l: `ITBI${safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}`, v: formatMoney(itbiCostEsc), n: itbiCostEsc },
        showLavraturaEsc && { l: 'Escritura', v: formatMoney(lavraturaCostExibido), n: lavraturaCostExibido },
        showFunrejusEsc && { l: 'Funrejus', v: formatMoney(funrejusCost), n: funrejusCost },
        showCertidoesEsc && safeCertidoesEsc > 0 && { l: 'Certidões e buscas', v: formatMoney(safeCertidoesEsc), n: safeCertidoesEsc },
        showDiligenciasEsc && safeDiligenciasEsc > 0 && { l: 'Diligências / assessoria', v: formatMoney(safeDiligenciasEsc), n: safeDiligenciasEsc },
        outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && { l: outrosDescEsc || 'Outros', v: formatMoney(safeOutrosEsc), n: safeOutrosEsc },
        incluirRgi && { l: 'Registro (RGI)', v: formatMoney(cartorioCostEsc), n: cartorioCostEsc },
        !outrosNoTotal && safeOutrosEsc > 0 && { l: `${outrosDescEsc || 'Outros'} (à parte, fora do total)`, v: formatMoney(safeOutrosEsc), n: safeOutrosEsc, skip: true },
      ].filter(Boolean);

      const painelEscritura = (
        <PainelResultado
          rotulo={`Total do orçamento${incluirRgi ? ' (com registro)' : ''}`}
          valor={safeNegocio > 0 ? formatMoney(totalEscrituraTela) : '—'}
          status={escrituraMode === 'pr' && escrituraExtrapolada ? { tom: 'aviso', texto: 'Acima do teto da tabela (R$ 226 mil): confirme no tabelionato' } : null}
          kpis={[
            { l: 'Negócio', v: safeNegocio > 0 ? formatMoney(safeNegocio) : '—' },
            { l: '% do negócio', v: safeNegocio > 0 ? formatPercent((totalEscrituraTela / safeNegocio) * 100) : '—' },
            { l: 'Base do ITBI', v: safeNegocio > 0 ? formatMoney(baseItbiTela) : '—' },
          ]}
          linhas={safeNegocio > 0 ? linhasEscritura : []}
          acoes={
            <AcoesPainel
              principal={{ rotulo: 'Gerar PDF do orçamento', icone: 'pdf', onClick: handlePrint, desabilitado: safeNegocio <= 0 }}
              linha={[
                { rotulo: 'Excel', icone: 'xls', onClick: () => handleGerarPlanilhaEscritura(), desabilitado: safeNegocio <= 0 },
                { rotulo: 'Exportar', icone: 'baixar', desabilitado: safeNegocio <= 0, menu: [
                  { rotulo: 'Planilha de cálculo (PDF)', detalhe: 'Tabela pronta para enviar', onClick: () => handleGerarPlanilhaEscritura('pdf') },
                  { rotulo: 'Copiar resumo', detalhe: 'Texto curto para colar', onClick: handleCopyResumo },
                  { rotulo: 'Enviar pelo WhatsApp', onClick: handleShareWhatsapp },
                  { rotulo: 'Salvar como caso', detalhe: 'Guarda este cálculo em "Casos salvos"', onClick: handleSaveCase },
                ] },
              ]}
              onLimpar={handleReset}
            />
          }
        >
          {safeNegocio <= 0 && <p className="mt-4 text-[12.5px] text-muted-foreground">Informe o valor real da negociação para ver o orçamento de custas.</p>}
          {safeNegocio > 0 && (
            <div className="mt-4 flex items-center justify-between gap-3 text-[13px]">
              <span className="text-muted-foreground">Subtotal sem registro</span>
              <span className="tabular-nums text-foreground">{formatMoney(custoInicialEsc)}</span>
            </div>
          )}
        </PainelResultado>
      );

      const abasEscritura = [
        { id: 'negocio', rotulo: 'Negócio', icone: 'acordo', conteudo: (
          <Grade>
            <Col span={3}><TextInput label="Nome do adquirente" value={clienteNome} onChange={setClienteNome} placeholder="Ex.: João Silva" /></Col>
            <Col span={3}><TextInput label="Descrição do imóvel" value={imovelDesc} onChange={setImovelDesc} placeholder="Ex.: Chácara São Pedro – Loanda/PR" /></Col>
            <Col span={2}><MoneyInput label="Valor real da negociação" value={negocioValor} onChange={setNegocioValor} /></Col>
            <Col span={2}><MoneyInput label="Valor venal (opcional)" value={valorVenalEsc} onChange={setValorVenalEsc} subText="Se maior que o negócio, o ITBI usa esta base." /></Col>
            <Col span={2}>
              <span className={ROTULO}>Registro de imóveis (RGI)</span>
              <Segmentado rotulo="Registro de imóveis (RGI) no total" valor={incluirRgi ? 'sim' : 'nao'} onChange={(v) => setIncluirRgi(v === 'sim')} cheio
                opcoes={[{ valor: 'sim', rotulo: 'Incluir' }, { valor: 'nao', rotulo: 'Não incluir' }]} />
            </Col>
          </Grade>
        ) },
        { id: 'custos', rotulo: 'Custos', icone: 'debito', conteudo: (
          <Grade>
            <Col span={6}>
              <div className="flex items-center justify-between gap-3">
                <span className="text-[12.5px] text-muted-foreground">Cálculo das custas</span>
                <Segmentado rotulo="Cálculo das custas" valor={escrituraMode} onChange={setEscrituraMode}
                  opcoes={[{ valor: 'pr', rotulo: 'Tabela TJ-PR' }, { valor: 'manual', rotulo: 'Manual' }]} />
              </div>
            </Col>
            <Col span={2}>
              <TaxInput label="ITBI" value={itbiEscritura.value} type={itbiEscritura.type} onChangeValue={(val) => setItbiEscritura({ ...itbiEscritura, value: val })} onChangeType={(t) => setItbiEscritura({ ...itbiEscritura, type: t })} description="Imposto de transmissão" />
              <ShowInBudgetToggle checked={showItbiEsc} onChange={setShowItbiEsc} />
            </Col>
            <Col span={2}>
              {escrituraMode === 'pr'
                ? <TaxInput label="Escritura de compra" value={Math.round(lavraturaCost * 100) / 100} type="fixed" disabled description={escrituraExtrapolada ? 'Acima do teto da tabela (226 mil)' : 'Tabela XI/TJ-PR 2026'} />
                : <TaxInput label="Escritura de compra" value={escrituraManual.value} type={escrituraManual.type} onChangeValue={(val) => setEscrituraManual({ ...escrituraManual, value: val })} onChangeType={(t) => setEscrituraManual({ ...escrituraManual, type: t })} description="Tabelionato" />}
              <ShowInBudgetToggle checked={showLavraturaEsc} onChange={setShowLavraturaEsc} />
            </Col>
            <Col span={2}>
              <TaxInput label="Funrejus obrigatório" value={Math.round(funrejusCost * 100) / 100} type="fixed" disabled description="0,2% (teto de R$ 7.408,87)" />
              <ShowInBudgetToggle checked={showFunrejusEsc} onChange={setShowFunrejusEsc} />
            </Col>
            <Col span={2}>
              {escrituraMode === 'pr'
                ? <TaxInput label="Registro de imóveis" value={Math.round(cartorioCostEsc * 100) / 100} type="fixed" disabled description="Tabela III-C/TJ-PR 2026" />
                : <TaxInput label="Registro de imóveis" value={rgiManual.value} type={rgiManual.type} onChangeValue={(val) => setRgiManual({ ...rgiManual, value: val })} onChangeType={(t) => setRgiManual({ ...rgiManual, type: t })} description="Cartório de registro" />}
            </Col>
            <Col span={2}>
              <MoneyInput label="Certidões e buscas" value={certidoesEsc} onChange={setCertidoesEsc} />
              <ShowInBudgetToggle checked={showCertidoesEsc} onChange={setShowCertidoesEsc} />
            </Col>
            <Col span={2}>
              <MoneyInput label="Diligências / assessoria" value={diligenciasEsc} onChange={setDiligenciasEsc} />
              <ShowInBudgetToggle checked={showDiligenciasEsc} onChange={setShowDiligenciasEsc} />
            </Col>
            {escrituraMode === 'pr' && escrituraExtrapolada && (
              <Col span={6}>
                <Alerta tipo="aviso">A tabela oficial de emolumentos do Tabelionato de Notas (Tabela XI) não define faixas acima de R$ 226.000,00. O valor exibido usa a última faixa conhecida como estimativa mínima: confirme o valor exato com o tabelionato.</Alerta>
              </Col>
            )}
          </Grade>
        ) },
        { id: 'outros', rotulo: 'Outros', icone: 'maisCirculo', conteudo: (
          <Grade>
            <Col span={4}><TextInput label="Outros (especifique)" value={outrosDescEsc} onChange={setOutrosDescEsc} placeholder="Ex.: Averbação de óbito" /></Col>
            <Col span={2}><MoneyInput label="Valor de outros" value={outrosValorEsc} onChange={setOutrosValorEsc} /></Col>
            <Col span={3}>
              <span className={ROTULO}>Somar outros ao total</span>
              <Segmentado rotulo="Como tratar o valor de outros" valor={outrosNoTotal ? 'total' : 'parte'} onChange={(v) => setOutrosNoTotal(v === 'total')} cheio
                opcoes={[{ valor: 'total', rotulo: 'Somar ao total' }, { valor: 'parte', rotulo: 'Valor à parte' }]} />
            </Col>
            <Col span={3}>
              {outrosNoTotal
                ? <div className="sm:pt-[25px]"><ShowInBudgetToggle checked={showOutrosEsc} onChange={setShowOutrosEsc} /></div>
                : <p className="sm:pt-[25px] text-[11.5px] text-muted-foreground">Exibido à parte, fora do total do orçamento.</p>}
            </Col>
          </Grade>
        ) },
      ];

      // ---- Cabeçalho, casos salvos e identificação ----
      const acoesCabecalho = (
        <>
          <Botao tamanho="sm" icone="salvar" onClick={() => setIsCasesOpen(!isCasesOpen)} aria-expanded={isCasesOpen}>Casos salvos{savedCases.length > 0 ? ` (${savedCases.length})` : ''}</Botao>
          <Botao tamanho="sm" icone="engrenagem" onClick={() => setIsSettingsOpen(!isSettingsOpen)} aria-expanded={isSettingsOpen} aria-label="Identificação do profissional" title="Identificação do profissional" className="!px-2.5" />
        </>
      );

      return (
        <Pagina
          titulo={eLeilao ? 'Calculadora de leilões' : 'Orçamento de escritura'}
          descricao={eLeilao ? 'Custo de arrematação, lucro e ROI.' : 'ITBI, escritura, Funrejus e registro (tabelas TJ-PR 2026).'}
          nota="Cálculo local no navegador" acoes={acoesCabecalho}>
          {isSettingsOpen && (
            <section className="bg-card border border-border rounded-[14px] px-4 sm:px-6 py-5 print-hide section-open">
              <h2 className="text-[15px] font-medium text-foreground mb-4">Identificação do profissional</h2>
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <TextInput label="Nome do profissional ou escritório" value={advName} onChange={setAdvName} />
                <TextInput label="Registro profissional (ex.: OAB/PR)" value={advOab} onChange={setAdvOab} />
              </div>
              <p className="text-xs text-muted-foreground mt-3">Aparece no relatório em PDF. Tabelas de custas TJ-PR vigentes desde {VIGENCIA_TABELAS_PR}; verifique as atualizações anuais antes de confiar em valores altos.</p>
            </section>
          )}

          {isCasesOpen && (
            <section className="bg-card border border-border rounded-[14px] px-4 sm:px-6 py-5 print-hide section-open">
              <div className="flex justify-between items-center gap-3 mb-3">
                <h2 className="text-[15px] font-medium text-foreground">Casos salvos</h2>
                <Botao tamanho="sm" variante="primario" onClick={handleSaveCase}>Salvar caso atual</Botao>
              </div>
              {savedCases.length === 0 ? (
                <p className="text-[13px] text-muted-foreground">Nenhum caso salvo ainda. Preencha os dados e clique em "Salvar caso atual" para voltar a este cálculo depois.</p>
              ) : (
                <ul className="divide-y divide-border max-h-64 overflow-y-auto">
                  {savedCases.map((c) => (
                    <li key={c.id} className="flex justify-between items-center gap-3 py-2.5">
                      <div className="min-w-0">
                        <div className="text-[13.5px] text-foreground truncate">{c.nome}</div>
                        <div className="text-xs text-muted-foreground">{c.tipo === 'leilao' ? 'Leilão' : 'Escritura'} · {c.data}</div>
                      </div>
                      <div className="flex gap-1 flex-shrink-0">
                        <Botao tamanho="sm" onClick={() => handleLoadCase(c.id)}>Abrir</Botao>
                        <Botao tamanho="sm" variante="perigo" onClick={() => handleDeleteCase(c.id)}>Excluir</Botao>
                      </div>
                    </li>
                  ))}
                </ul>
              )}
            </section>
          )}

          {eLeilao
            ? <Calculador abas={abasLeilao} aba={abaLeilao} onAba={setAbaLeilao} painel={painelLeilao} detalhes={detalhesLeilao} />
            : <Calculador abas={abasEscritura} aba={abaEscritura} onAba={setAbaEscritura} painel={painelEscritura} />}

          {/* ===== DOCUMENTOS DE IMPRESSÃO (formais, só aparecem ao imprimir) ===== */}
          {eLeilao && (
            <div id="pdf-leilao">
              <div className="hidden print:block text-black">
                      <div className="flex justify-between items-end border-b-2 border-black pb-3 mb-5">
                        <div>
                          <div className="text-base font-bold uppercase tracking-tight">{advName}</div>
                          <div className="text-[11px]">{advOab}</div>
                        </div>
                        <div className="text-right text-[9px] text-gray-600">
                          Documento gerado em {formatDateTime(new Date())}
                        </div>
                      </div>

                      <h1 className="text-sm font-bold uppercase text-center mb-1 tracking-wide">
                        {assetType === 'veiculo' ? (isRegularizacao ? 'Análise de Compra com Regularização Judicial' : 'Análise de Viabilidade Veicular') : 'Análise de Viabilidade Imobiliária'}
                      </h1>
                      <p className="text-[9px] text-center text-gray-500 mb-5">Relatório estimativo de custos e retorno financeiro</p>

                      {(clienteNomeLeilao || imovelDescLeilao) && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            {clienteNomeLeilao && (
                              <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">{assetType === 'veiculo' && isRegularizacao ? 'Comprador' : 'Arrematante'}</td><td className="py-1 align-top">{clienteNomeLeilao}</td></tr>
                            )}
                            {imovelDescLeilao && (
                              <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">{assetType === 'veiculo' ? 'Veículo' : 'Imóvel'}</td><td className="py-1 align-top">{imovelDescLeilao}</td></tr>
                            )}
                          </tbody>
                        </table>
                      )}

                      {assetType === 'veiculo' && safeMarket > 0 && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            <tr className="border-b border-gray-300"><td className="py-1">Tabela FIPE (Cheia)</td><td className="py-1 text-right">{formatMoney(safeMarket)}</td></tr>
                            <tr className="border-b border-gray-300"><td className="py-1">Venda Estimada (desvalorização de {formatCurrencyStr(fipeDiscountClamped)}%)</td><td className="py-1 text-right">{formatMoney(discountedSaleValue)}</td></tr>
                            <tr className="border-b border-gray-300"><td className="py-1">{isRegularizacao ? 'Compra' : 'Arremate'} em relação à FIPE</td><td className="py-1 text-right">{arremateFipePercent.toFixed(1)}%</td></tr>
                            {safeEval > 0 && <tr className="border-b border-gray-300"><td className="py-1">Avaliação {isRegularizacao ? 'Atual' : 'Judicial'}</td><td className="py-1 text-right">{formatMoney(safeEval)}</td></tr>}
                            {maxBidForProfit > 0 && <tr><td className="py-1">Teto de Lance para Lucro Zero</td><td className="py-1 text-right">{formatMoney(maxBidForProfit)}</td></tr>}
                          </tbody>
                        </table>
                      )}

                      {assetType !== 'veiculo' && safeSize > 0 && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            <tr>
                              <td className="py-1 font-bold uppercase w-1/4">Dimensões</td>
                              <td className="py-1">
                                {assetType === 'rural'
                                  ? `${formatCurrencyStr(areaInM2)} m² · ${formatCurrencyStr(areaInHa)} ha · ${formatCurrencyStr(areaInAlq)} ${alqName}`
                                  : `${formatCurrencyStr(areaInM2)} m²`}
                              </td>
                            </tr>
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <thead>
                          <tr className="border-b-2 border-black">
                            <th className="text-left py-1.5 font-bold uppercase">Descrição</th>
                            <th className="text-right py-1.5 font-bold uppercase">Valor</th>
                          </tr>
                        </thead>
                        <tbody>
                          <tr className="border-b border-gray-300">
                            <td className="py-1.5 font-bold">{isRegularizacao ? "Valor da Compra Acordada" : "Valor de Aquisição (Lance)"}</td>
                            <td className="py-1.5 text-right font-bold">{formatMoney(safeBid)}</td>
                          </tr>
                          {!isRegularizacao && (
                            <tr className="border-b border-gray-300"><td className="py-1.5">Comissão do Leiloeiro</td><td className="py-1.5 text-right">{formatMoney(leiloeiroCost)}</td></tr>
                          )}
                          {assetType !== 'veiculo' && (
                            <>
                              <tr className="border-b border-gray-300"><td className="py-1.5">ITBI Arrematação{safeNumber(valorVenalLeilao) > safeBid ? ' (s/ valor venal)' : ''}</td><td className="py-1.5 text-right">{formatMoney(itbiCostLeilao)}</td></tr>
                              <tr className="border-b border-gray-300"><td className="py-1.5">Cartório de Registro</td><td className="py-1.5 text-right">{formatMoney(cartorioCostLeilao)}</td></tr>
                            </>
                          )}
                          <tr className="border-b border-gray-300"><td className="py-1.5">{isRegularizacao ? "Honorários Judiciais e Custas" : "Assessoria Jurídica"}</td><td className="py-1.5 text-right">{formatMoney(legalCost)}</td></tr>
                          {(safeNumber(debts) > 0 || safeNumber(renovation) > 0) && (
                            <tr className="border-b border-gray-300"><td className="py-1.5">{isRegularizacao ? "Multas, Documentação e Reparos" : "Passivos e Custos Extras"}</td><td className="py-1.5 text-right">{formatMoney(fixedCostsLeilao)}</td></tr>
                          )}
                          <tr className="border-t-2 border-black">
                            <td className="py-2 font-bold uppercase">Custo Operacional Total</td>
                            <td className="py-2 text-right font-bold">{formatMoney(finalLeilao)}</td>
                          </tr>
                        </tbody>
                      </table>

                      {discountedSaleValue > 0 && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <tbody>
                            <tr className="border-b border-gray-300"><td className="py-1.5 font-semibold">{lucroAbsoluto >= 0 ? 'Lucro Absoluto Estimado' : 'Prejuízo Estimado'}</td><td className="py-1.5 text-right font-bold">{formatMoney(lucroAbsoluto)}</td></tr>
                            <tr><td className="py-1.5 font-semibold">Retorno / Margem (ROI)</td><td className="py-1.5 text-right font-bold">{margemLucroPorcentagem > 0 ? '+' : ''}{formatCurrencyStr(margemLucroPorcentagem)}%</td></tr>
                          </tbody>
                        </table>
                      )}

                      {segundaPracaResult && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black">
                              <th className="text-left py-1.5 font-bold uppercase" colSpan="2">Comparativo com a 2ª Praça</th>
                            </tr>
                          </thead>
                          <tbody>
                            <tr className="border-b border-gray-300"><td className="py-1.5">Lance na 2ª Praça</td><td className="py-1.5 text-right">{formatMoney(safeSegundaPraca)}</td></tr>
                            <tr className="border-b border-gray-300"><td className="py-1.5 font-semibold">Custo Operacional (2ª Praça)</td><td className="py-1.5 text-right font-bold">{formatMoney(segundaPracaResult.total)}</td></tr>
                            <tr className="border-b border-gray-300"><td className="py-1.5">{economiaSegundaPraca >= 0 ? 'Economia na 2ª praça' : 'Custo a mais na 2ª praça'}</td><td className="py-1.5 text-right">{formatMoney(Math.abs(economiaSegundaPraca))}</td></tr>
                            {discountedSaleValue > 0 && (
                              <tr><td className="py-1.5 font-semibold">Lucro Estimado (2ª Praça)</td><td className="py-1.5 text-right font-bold">{formatMoney(segundaPracaResult.lucro)}</td></tr>
                            )}
                          </tbody>
                        </table>
                      )}

                      {assetType !== 'veiculo' && safeSize > 0 && (safeEval > 0 || safeMarket > 0) && (
                        <table className="w-full text-[9px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b border-black">
                              <th className="text-left py-1 font-bold uppercase">Comparação por Área</th>
                              <th className="text-right py-1 font-bold uppercase">Por m²</th>
                              {assetType === 'rural' && <th className="text-right py-1 font-bold uppercase">Por Hectare</th>}
                              {assetType === 'rural' && <th className="text-right py-1 font-bold uppercase">Por {alqName}</th>}
                            </tr>
                          </thead>
                          <tbody>
                            {safeEval > 0 && (
                              <tr className="border-b border-gray-300">
                                <td className="py-1">Avaliação ({formatMoney(safeEval)})</td>
                                <td className="py-1 text-right">{formatMoney(ratesEval.m2)}</td>
                                {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesEval.ha)}</td>}
                                {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesEval.alq)}</td>}
                              </tr>
                            )}
                            {safeMarket > 0 && (
                              <tr className="border-b border-gray-300">
                                <td className="py-1">Mercado Real ({formatMoney(safeMarket)})</td>
                                <td className="py-1 text-right">{formatMoney(ratesMarket.m2)}</td>
                                {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesMarket.ha)}</td>}
                                {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesMarket.alq)}</td>}
                              </tr>
                            )}
                            <tr>
                              <td className="py-1">Arrematação ({formatMoney(safeBid)})</td>
                              <td className="py-1 text-right">{formatMoney(ratesBid.m2)}</td>
                              {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesBid.ha)}</td>}
                              {assetType === 'rural' && <td className="py-1 text-right">{formatMoney(ratesBid.alq)}</td>}
                            </tr>
                          </tbody>
                        </table>
                      )}


                      <div className="flex justify-between text-[9px] avoid-break">
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">{advName}</div>
                          <div className="text-gray-600">{advOab}</div>
                        </div>
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">Assinatura do Cliente</div>
                          <div className="text-gray-600">Ciente da Estimativa</div>
                        </div>
                      </div>
                    </div>
            </div>
          )}
          {!eLeilao && (
            <div id="pdf-escritura">
              <div className="hidden print:block text-black">
                      <div className="flex justify-between items-end border-b-2 border-black pb-3 mb-5">
                        <div>
                          <div className="text-base font-bold uppercase tracking-tight">{advName}</div>
                          <div className="text-[11px]">{advOab}</div>
                        </div>
                        <div className="text-right text-[9px] text-gray-600">
                          Documento gerado em {formatDateTime(new Date())}
                        </div>
                      </div>

                      <h1 className="text-sm font-bold uppercase text-center mb-1 tracking-wide">Memorial de Custas de Escrituração</h1>
                      <p className="text-[9px] text-center text-gray-500 mb-5">Simulação estimativa de custos de transmissão imobiliária</p>

                      {(clienteNome || imovelDesc) && (
                        <table className="w-full text-[11px] mb-5 border-collapse avoid-break">
                          <tbody>
                            {clienteNome && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Adquirente</td><td className="py-1 align-top">{clienteNome}</td></tr>}
                            {imovelDesc && <tr><td className="py-1 pr-3 font-bold uppercase w-1/4 align-top">Imóvel</td><td className="py-1 align-top">{imovelDesc}</td></tr>}
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <thead>
                          <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 1 — Lavratura, Impostos e Acessórios</th></tr>
                        </thead>
                        <tbody>
                          <tr className="border-b border-gray-300"><td className="py-1.5 font-bold">Base da Transação</td><td className="py-1.5 text-right font-bold">{formatMoney(safeNegocio)}</td></tr>
                          {showItbiEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Imposto de Transmissão (ITBI){safeNumber(valorVenalEsc) > safeNegocio ? ' (s/ valor venal)' : ''}</td><td className="py-1.5 text-right">{formatMoney(itbiCostEsc)}</td></tr>}
                          {showLavraturaEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Ato de Escrituração Imobiliária{escrituraExtrapolada ? ' *' : ''}</td><td className="py-1.5 text-right">{formatMoney(lavraturaCostExibido)}</td></tr>}
                          {showFunrejusEsc && <tr className="border-b border-gray-300"><td className="py-1.5">Funrejus Compulsório (0,2% — TJPR)</td><td className="py-1.5 text-right">{formatMoney(funrejusCost)}</td></tr>}
                          {showCertidoesEsc && safeCertidoesEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Certidões e Buscas</td><td className="py-1.5 text-right">{formatMoney(safeCertidoesEsc)}</td></tr>}
                          {showDiligenciasEsc && safeDiligenciasEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">Diligências / Assessoria</td><td className="py-1.5 text-right">{formatMoney(safeDiligenciasEsc)}</td></tr>}
                          {outrosNoTotal && showOutrosEsc && safeOutrosEsc > 0 && <tr className="border-b border-gray-300"><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>}
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Subtotal Sem Registro</td><td className="py-2 text-right font-bold">{formatMoney(custoInicialEsc)}</td></tr>
                        </tbody>
                      </table>

                      {!outrosNoTotal && safeOutrosEsc > 0 && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Valor à Parte (não incluído no total)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5">{outrosDescEsc || 'Outros'}</td><td className="py-1.5 text-right">{formatMoney(safeOutrosEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      {incluirRgi && (
                        <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                          <thead>
                            <tr className="border-b-2 border-black"><th colSpan="2" className="text-left py-1.5 font-bold uppercase">Passo 2 — Registro de Imóveis (RGI)</th></tr>
                          </thead>
                          <tbody>
                            <tr><td className="py-1.5 font-bold">Emolumento de Registro</td><td className="py-1.5 text-right font-bold">{formatMoney(cartorioCostEsc)}</td></tr>
                          </tbody>
                        </table>
                      )}

                      <table className="w-full text-[11px] border-collapse mb-5 avoid-break">
                        <tbody>
                          <tr className="border-t-2 border-black"><td className="py-2 font-bold uppercase">Total Estimado{incluirRgi ? ' (com Registro RGI)' : ''}</td><td className="py-2 text-right font-bold">{formatMoney(totalEscrituraComRegistro)}</td></tr>
                        </tbody>
                      </table>

                      {escrituraExtrapolada && (
                        <p className="text-[8px] text-gray-600 text-justify leading-relaxed mb-10">* A tabela oficial do Tabelionato de Notas não define faixas acima de R$226.000,00; o valor exibido é uma estimativa mínima baseada na última faixa conhecida — confirme com o tabelionato.</p>
                      )}

                      <div className="flex justify-between text-[9px] avoid-break">
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">{advName}</div>
                          <div className="text-gray-600">{advOab}</div>
                        </div>
                        <div className="text-center w-56">
                          <div className="border-t border-black pt-1 font-bold">Assinatura do Cliente</div>
                          <div className="text-gray-600">Ciente da Estimativa</div>
                        </div>
                      </div>
                    </div>
            </div>
          )}

          {toast && (
            <div role="status" aria-live="polite" className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 max-w-[90vw] px-[18px] py-2.5 rounded-[10px] bg-card text-foreground border border-primary text-[13px] shadow-md print-hide section-open">
              {toast}
            </div>
          )}
        </Pagina>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<window.CentralPlataforma.Plataforma AppLeiloes={App} />);
  </script>
</body>
</html>
