name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes do motor e dos documentos
        run: node --test test/regras.test.js test/calculo.test.js test/xlsx.test.js test/pdf.test.js
