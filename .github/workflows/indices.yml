name: Atualizar índices de correção

# Busca IPCA, INPC, IGP-M e IPCA-E no Banco Central uma vez por dia e grava dados/indices.json
# (só quando algum valor muda). Também pode ser executado à mão em Actions > "Run workflow".
on:
  schedule:
    - cron: '17 12 * * *' # todo dia às 09:17 (Brasília)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: indices
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Buscar índices no Banco Central
        run: node scripts/atualizar-indices.js
      - name: Gravar e publicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- dados/indices.json; then
            echo "Tabela de índices sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/indices.json
          git commit -m "Atualiza a tabela de índices de correção"
          git push
          # Pede a publicação do GitHub Pages (pushes feitos pelo robô podem não disparar a publicação sozinhos)
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Não foi possível pedir a publicação do Pages agora."
